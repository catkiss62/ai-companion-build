$('gesture').addEventListener('pointerdown',e=>{if(pullPointer!==null||activePointer!==null)return;sound.unlock();e.preventDefault();releaseGate=false;activePointer=e.pointerId;$('gesture').setPointerCapture(e.pointerId);const p=point(e);trail=[{...p,t:time}];});
$('gesture').addEventListener('pointermove',e=>{if(e.pointerId!==activePointer||releaseGate)return;e.preventDefault();const events=e.getCoalescedEvents?.()||[];for(const ev of events.length?events:[e]){const p=point(ev),prev=trail.at(-1);if(prev)cut(prev,p);if(activePointer===null)break;trail.push({...p,t:time});if(trail.length>30)trail.shift();}});
function releaseSlash(e){if(e.pointerId===activePointer){activePointer=null;if($('gesture').hasPointerCapture(e.pointerId))$('gesture').releasePointerCapture(e.pointerId)}}
$('gesture').addEventListener('pointerup',releaseSlash);$('gesture').addEventListener('pointercancel',releaseSlash);
$('again').onclick=()=>{sound.unlock();startGame();$('subscore').textContent='切开文字 · 避开小鲸鱼'};
for(const b of app.querySelectorAll('header button,nav button,#composer button'))b.onclick=()=>toast('这是聊天界面示意，向下拉右侧小鲸鱼开始');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode!=='idle')exitGame()});document.addEventListener('visibilitychange',()=>{visible=!document.hidden;last=0;acc=0;if(!visible){sound.stop();activePointer=null;drag=null;pullPointer=null;trail=[];pending=null;}});
window.addEventListener('resize',resize);
Promise.all(Object.entries(ASSETS).map(async([name,asset])=>{images[name]=await Promise.all(asset.frames.map(src=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})));})).then(()=>{loaded=true;resize();NativeSlice.ready();requestAnimationFrame(frame)}).catch(()=>NativeSlice.failed());

function cancelHostPointers(){for(const [element,id] of [[pendant,pullPointer],[$('gesture'),activePointer]]){if(id!==null&&element.hasPointerCapture(id))element.releasePointerCapture(id);}drag=null;pullPointer=null;pullStart=null;activePointer=null;pending=null;trail=[];}
window.sliceHost={
 motion(x,y,reset=false){
  const valid=Number.isFinite(x)&&Number.isFinite(y)&&!reset;
  targetRopeGravity.x=valid?clamp(x,-1,1):0;
  targetRopeGravity.y=valid?clamp(y,-1,1):1;
 },
 configure(layout){hostLayout=layout;hostReady=true;$('hud').style.top=(layout.hudTop+8)+'px';resize();},
 start(snapshot){startWaiting=false;if(!hostReady||!visible)return;hostGlyphs=snapshot;startCapturedGame();},
 reset(){exitGame();sound.stop();},
 suspend(){ropeGravity.x=targetRopeGravity.x=0;ropeGravity.y=targetRopeGravity.y=1;exitGame();sound.stop();visible=false;last=0;acc=0;},
 resume(){visible=true;last=0;acc=0;},
};
window.addEventListener('error',()=>NativeSlice.failed());
window.addEventListener('unhandledrejection',()=>NativeSlice.failed());
setInterval(()=>NativeSlice.heartbeat(),500);
</script></body></html>
