function stepRope(dt){

  const distance=Math.hypot(drag.x-anchor.x,drag.y-anchor.y);

}

$('gesture').addEventListener('pointermove',e=>{if(e.pointerId!==activePointer||releaseGate)return;e.preventDefault();const events=e.getCoalescedEvents?.()||[];for(const ev of events.length?events:[e]){const p=point(ev),prev=trail.at(-1);if(!introCacheJob&&(mode==='intro'||mode==='playing'))swipeSound.move(p);if(prev)cut(prev,p);if(activePointer===null)break;trail.push({...p,t:time});if(trail.length>30)trail.shift();}});
function releaseSlash(e){if(e.pointerId===activePointer){activePointer=null;swipeSound.reset();if($('gesture').hasPointerCapture(e.pointerId))$('gesture').releasePointerCapture(e.pointerId)}}
$('gesture').addEventListener('pointerup',releaseSlash);$('gesture').addEventListener('pointercancel',releaseSlash);$('gesture').addEventListener('lostpointercapture',releaseSlash);
$('again').onclick=()=>{sound.unlock();startGame();$('subscore').textContent='切开文字 · 避开小鲸鱼'};
for(const b of app.querySelectorAll('header button,nav button,#composer button'))b.onclick=()=>toast('这是聊天界面示意，向下拉右侧小鲸鱼开始');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mode!=='idle')exitGame()});document.addEventListener('visibilitychange',()=>{visible=!document.hidden;last=0;acc=0;if(!visible){sound.stop();activePointer=null;swipeSound.reset();drag=null;pullPointer=null;trail=[];pending=null;}});
window.addEventListener('resize',resize);
Promise.all(Object.entries(ASSETS).map(async([name,asset])=>{images[name]=await Promise.all(asset.frames.map(src=>new Promise((resolve,reject)=>{let im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})));})).then(()=>{loaded=true;$('avatar').src=ASSETS['默认动作'].frames[0];resize();requestAnimationFrame(frame)}).catch(()=>toast('素材加载失败，请重新打开文件'));
</script></body></html>
