name: v042155 TTS failure classification regression
on:
  push:
    branches: [agent/v042155-tts-classification-check]
permissions:
  contents: read
jobs:
  classifier:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile and run the exact production classifier and JUnit test
        shell: bash
        run: |
          set -euo pipefail
          TEST_PROJECT="${RUNNER_TEMP}/tts-failure-classifier"
          mkdir -p "${TEST_PROJECT}/src/main/kotlin" "${TEST_PROJECT}/src/test/kotlin"
          cp app/android/app/src/main/kotlin/com/aicompanion/localfirst/TtsFailureCategory.kt "${TEST_PROJECT}/src/main/kotlin/"
          cp app/android/app/src/test/kotlin/com/aicompanion/localfirst/TtsFailureCategoryTest.kt "${TEST_PROJECT}/src/test/kotlin/"
          cat > "${TEST_PROJECT}/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { gradlePluginPortal(); mavenCentral() } }
          rootProject.name = "tts-failure-classifier"
          EOF
          cat > "${TEST_PROJECT}/build.gradle.kts" <<'EOF'
          plugins { kotlin("jvm") version "2.1.0" }
          repositories { mavenCentral() }
          dependencies { testImplementation("junit:junit:4.13.2") }
          tasks.test { useJUnit(); testLogging { events("passed", "skipped", "failed") } }
          EOF
          chmod +x app/android/gradlew
          app/android/gradlew -p "${TEST_PROJECT}" test --no-daemon
          python3 - "${TEST_PROJECT}/build/test-results/test" <<'PY'
          from pathlib import Path
          import sys, xml.etree.ElementTree as ET
          suites=[ET.parse(p).getroot() for p in Path(sys.argv[1]).glob("TEST-*.xml")]
          assert suites, "No JUnit results"
          counts={key:sum(int(s.get(key, "0")) for s in suites) for key in ["tests","failures","errors","skipped"]}
          assert counts["tests"]==1 and counts["failures"]==counts["errors"]==counts["skipped"]==0, counts
          print("TTS_CLASSIFIER_RESULT", counts)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v042155-tts-failure-classifier-results
          path: ${{ runner.temp }}/tts-failure-classifier/build/test-results/test/
          retention-days: 14
