name: System logic hardening validation (no APK)
on:
  push:
    branches: [agent/v042107-review-recovery]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system-logic-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true
      - name: Restore pinned presentation assets required by widget tests
        run: bash tools/fetch_lingchat_visual_assets.sh
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - name: Analyze all Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - name: Dual Live2D identity, restore and existing presentation regression
        run: flutter test --timeout 60s --reporter expanded test/dual_live2d_profiles_v042154_test.dart test/caicai_stage_editor_test.dart test/portable_live2d_refresh_v04258_test.dart test/caicai_live2d_stage_test.dart test/live2d_settings_page_test.dart test/caicai_motion_planner_test.dart
        working-directory: app
      - name: Creative page bridge failure recovery
        run: node app/tools/test_creative_bridge.mjs
      - name: Third transport reuse, sharing settlement and image sender regression
        run: flutter test --timeout 60s --reporter expanded test/third_transport_v042153_test.dart test/share_queue_v042153_test.dart test/image_sender_grounding_v042153_test.dart test/proactive_source_fence_g3_test.dart
        working-directory: app
      - name: Third channel, vision routing and QQ participation regression
        run: flutter test --timeout 60s --reporter expanded test/third_channel_v042149_test.dart test/third_channel_chat_v042149_test.dart test/qq_participation_v042149_test.dart
        working-directory: app
      - name: QQ continuation receipts, Cedar control media and independent reasoning regression
        run: flutter test --timeout 60s --reporter expanded test/qq_continuation_v042150_test.dart test/cedar_control_media_v042150_test.dart test/third_effort_v042150_test.dart
        working-directory: app
      - name: Public gateway health deadlines, cancellation and private diagnostics regression
        run: flutter test --timeout 60s --reporter expanded test/third_channel_network_v042152_test.dart
        working-directory: app
      - name: Foreground Cedar control, atomic state and QQ terminal-media regression
        run: flutter test --timeout 60s --reporter expanded test/cedar_control_commit_v042151_test.dart test/qq_consumption_media_v042151_test.dart
        working-directory: app
      - name: QQ, game and web recovery regression
        run: flutter test --timeout 60s --reporter expanded test/qq_addressing_receipts_v042148_test.dart test/cedar_media_recovery_v042148_test.dart test/qq_recovery_v042148_test.dart test/qq_persona_clock_errors_v042148_test.dart test/web_share_recovery_v042148_test.dart test/qq_delivery_repair_v042147_test.dart test/qq_voice_v042146_test.dart test/qq_echo_v042146_test.dart test/qq_media_share_v042137_test.dart test/proactive_presentation_v042145_test.dart test/qq_speaker_identity_v042145_test.dart test/speech_presentation_owner_v042121_test.dart test/tts_playback_queue_test.dart test/playback_owner_v042104_test.dart test/stability_repair_v042134_test.dart test/qq_context_repair_v042144_test.dart test/cedar_parked_selection_v042144_test.dart test/qq_material_v042143_test.dart test/qq_gif_v042143_test.dart test/qq_group_runtime_v042137_test.dart test/qq_followup_v042142_test.dart test/proactive_night_v042142_test.dart test/daily_wake_v04275_test.dart test/desire_core_policy_v031_test.dart test/qq_learning_sketch_v042141_test.dart test/qq_archives_v042140_test.dart test/game_execution_v042140_test.dart
        working-directory: app
      - name: Focused source and background regression suite
