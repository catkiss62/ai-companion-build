name: System logic hardening validation (no APK)
on:
  push:
    branches: [agent/v042105-regression-fixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: system-logic-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true
      - name: Restore pinned presentation assets required by widget tests
        run: bash tools/fetch_lingchat_visual_assets.sh
        working-directory: app
      - run: flutter pub get
        working-directory: app
      - name: Analyze all Dart sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - name: Creative page bridge failure recovery
        run: node app/tools/test_creative_bridge.mjs
      - name: Focused source and background regression suite
        run: >-
          flutter test --timeout 60s --reporter expanded
          test/phone_history_v042105_test.dart
          test/wish_mechanism_v042105_test.dart
          test/autonomous_duration_v042105_test.dart
          test/agent_tool_planner_fast_route_test.dart
          test/wish_self_disposition_test.dart
          test/cedar_timed_recovery_v04261_test.dart
          test/cedar_timed_live_share_v04254_test.dart
          test/cedar_end_to_end_state_machine_v04182_test.dart
          test/g3_source_pipeline_test.dart
          test/g3_source_summary_counterexamples_test.dart
          test/background_source_guards_v042104_test.dart
          test/calendar_local_day_dst_v042104_test.dart
          test/g3_moe_sequence_restore_v042104_test.dart
          test/moe_observation_source_v042104_test.dart
          test/proactive_source_fence_g3_test.dart
          test/public_web_atomic_delivery_g3_review_test.dart
          test/public_web_share_g3_test.dart
          test/wish_source_clock_v042104_test.dart
          test/learning_lifecycle_v042104_test.dart
          test/regeneration_effects_v042104_test.dart
          test/playback_owner_v042104_test.dart
          test/personality_learning_phase1_test.dart
          test/memory_json_budget_retry_test.dart
          test/creative_facts_test.dart
          test/deep_reflection_test.dart
          test/memory_grounding_policy_test.dart
          test/wish_review_v04286_test.dart
        working-directory: app
