name: Correct v306 draft test notes
on:
  push:
    branches:
      - agent/v04261-recovery-analyze
permissions:
  contents: write
  actions: read
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify successful build and correct unpublished test notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/catkiss62/ai-companion-build/actions/runs/36904432860 --jq .conclusion | grep -qx success
          gh api 'repos/catkiss62/ai-companion-build/releases?per_page=20' > /tmp/releases.json
          python3 - <<'PY'
          import json
          r=next(r for r in json.load(open('/tmp/releases.json')) if r['tag_name']=='v0.42.62-reply-wait-restore-test')
          assert r['draft'] is True
          assert r['target_commitish']=='65b21322693b4e9b67f907a9d476d9ff90cf286f'
          PY
          cat > /tmp/notes.txt <<'NOTES'
          v0.42.62+306 test build.
          
          Fixes chat lease renewal during silent provider/tool waits and a no-progress timeout that could be extended by empty SSE keepalives. Restores database rows in bounded batches within one atomic transaction, preserving rollback and large settings. Adds body-free request-stage and restore-timing diagnostics.
          
          An identical simulated timed-tool -> final reply -> durable commit -> game activation test passed on +303, +304, +305 and this candidate. The specific real-device no-reply incident is not yet confirmed resolved; these checks do not validate the external model service or authenticated Cedar gameplay.
          
          Manual Stop, neutral task reports, two-minute solo cadence, replacement budgets without stacking, and Live2D settings import without reload are preserved. Unpublished device test build.
          NOTES
          gh release edit v0.42.62-reply-wait-restore-test --repo catkiss62/ai-companion-build --draft --notes-file /tmp/notes.txt
