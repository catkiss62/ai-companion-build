name: Timed recovery Dart analysis
on:
  push:
    branches: [agent/v04261-recovery-analyze]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: timed-recovery-analysis-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7c089e3d106d932a26004658339cfa9f5c6d95af
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
      - name: Confirm tested source
        run: git rev-parse HEAD
      - name: Fetch Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Analyze production and regression tests
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Timed recovery and portable snapshot behavior
        working-directory: app
        run: flutter test --no-test-assets test/cedar_timed_recovery_v04261_test.dart test/portable_snapshot_v04256_test.dart test/cedar_timed_live_share_v04254_test.dart test/cedar_cadence_regression_v04259_test.dart
