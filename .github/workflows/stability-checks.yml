name: Stability regression checks
on:
  push:
    branches: [agent/v04263-stability, agent/v04264-experience, agent/v04266-memory-continuity, agent/v04267-persistent-mood, agent/v04268-deep-web, agent/v04269-expression-diary, agent/v04270-wish-lifecycle, agent/v04271-deep-reflection, agent/v04272-proactive-windows, agent/v04273-phone-activity-evidence, agent/v04275-daily-wake, agent/v04276-fate-wheel-start, agent/v04277-conversation-topics, agent/v04278-nightly-dream, agent/v04279-wish-chat-fixes]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stability-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - name: Behavioral regression tests
        run: >-
          flutter test
          test/jev_decision_gateway_test.dart
          test/wish_self_disposition_test.dart
          test/chat_tail_follower_test.dart
          test/nightly_dream_test.dart
          test/nightly_dream_pipeline_test.dart
          test/conversation_topic_policy_test.dart
          test/conversation_initiative_v0404_test.dart
          test/phone_activity_evidence_v04273_test.dart
          test/presence_intelligence_test.dart
          test/daily_wake_v04275_test.dart
          test/proactive_windows_v04272_test.dart
          test/proactive_dawn_gate_policy_test.dart
          test/proactive_frequency_hotfix_v0403_test.dart
          test/deep_reflection_test.dart
          test/deep_reflection_pipeline_test.dart
          test/companion_wish_lifecycle_test.dart
          test/expression_diary_v04269_test.dart
          test/diary_retry_repository_v04269_test.dart
          test/deep_web_v04268_test.dart
          test/deep_web_pipeline_v04268_test.dart
          test/persistent_mood_v04267_test.dart
          test/memory_continuity_v04266_test.dart
          test/caicai_motion_planner_test.dart
          test/memory_retrieval_policy_test.dart
          test/memory_lifecycle_policy_test.dart
          test/playful_integrity_v04265_test.dart
          test/experience_v04264_test.dart
          test/public_image_download_boundary_test.dart
          test/safe_public_image_downloader_test.dart
          test/brain_work_fence_test.dart
          test/generation_wait_restore_v04262_test.dart
          test/timed_reply_pipeline_v04262_test.dart
          test/portable_snapshot_v04256_test.dart
          test/snapshot_directory_swap_test.dart
          test/snapshot_process_recovery_test.dart
          test/calendar_reminder_store_test.dart
          test/mcp_transport_boundary_test.dart
          test/cedar_end_to_end_state_machine_v04182_test.dart
          test/cedar_cadence_regression_v04259_test.dart
          test/unhandled_error_recorder_test.dart
        working-directory: app
