name: Build AI Companion v0.28.2 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_companion_v0_28_source.part-*'
      - 'v0281-startup-recovery.patch'
      - 'v0282-android-sqlite-open.patch'
      - '.github/workflows/build-v028-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Restore verified v0.28 base source
        shell: bash
        run: |
          set -euo pipefail
          ls -lh ai_companion_v0_28_source.part-*
          cat ai_companion_v0_28_source.part-* > ai_companion_v0_28_source.zip
          echo "53d2aefb922c6477087bddb93b44a4b95e7e1a0c4b4bea3e1d9611486c9bbea8 ai_companion_v0_28_source.zip" | sha256sum -c -
          unzip -q ai_companion_v0_28_source.zip
          test -f ai_companion_v0_28/pubspec.yaml
          test -f v0281-startup-recovery.patch
          test -f v0282-android-sqlite-open.patch

      - name: Apply v0.28.1 startup recovery patch
        shell: bash
        working-directory: ai_companion_v0_28
        run: |
          set -euo pipefail
          patch -p1 < ../v0281-startup-recovery.patch
          grep -q '^version: 0.28.1+29$' pubspec.yaml

      - name: Apply v0.28.2 Android SQLite open patch
        shell: bash
        working-directory: ai_companion_v0_28
        run: |
          set -euo pipefail
          patch -p1 < ../v0282-android-sqlite-open.patch
          grep -q '^version: 0.28.2+30$' pubspec.yaml
          grep -q "rawQuery('PRAGMA journal_mode = WAL')" lib/core/database/app_database.dart
          ! grep -q "execute('PRAGMA journal_mode = WAL')" lib/core/database/app_database.dart
          python3 tools/validate_v0282_pragma.py

      - name: Resolve Flutter packages
        working-directory: ai_companion_v0_28
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ai_companion_v0_28
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ai_companion_v0_28
        run: flutter build apk --release

      - name: Verify APK and create SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK='ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          sha256sum "$APK" | tee ai_companion_v0_28/app-release.apk.sha256
          ls -lh "$APK" ai_companion_v0_28/app-release.apk.sha256

      - name: Upload v0.28.2 checkpoint APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-v0.28.2-SQLite-Recovery-APK
          if-no-files-found: error
          compression-level: 0
          path: |
            ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk
            ai_companion_v0_28/app-release.apk.sha256
