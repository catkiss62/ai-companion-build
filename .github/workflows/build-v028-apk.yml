name: Build AI Companion v0.28 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_companion_v0_28_source.part-*'
      - '.github/workflows/build-v028-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          "$HOME/flutter/bin/flutter" config --no-analytics
          "$HOME/flutter/bin/flutter" precache --android

      - name: Reassemble and verify v0.28 source
        shell: bash
        run: |
          set -euo pipefail
          ls -lh ai_companion_v0_28_source.part-*
          cat ai_companion_v0_28_source.part-* > ai_companion_v0_28_source.zip
          echo '53d2aefb922c6477087bddb93b44a4b95e7e1a0c4b4bea3e1d9611486c9bbea8  ai_companion_v0_28_source.zip' | sha256sum -c -
          unzip -q ai_companion_v0_28_source.zip
          test -f ai_companion_v0_28/pubspec.yaml
          test -f ai_companion_v0_28/android/app/build.gradle.kts

      - name: Restore Gradle wrapper files
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android /tmp/flutter_wrapper_template >/dev/null
          cp /tmp/flutter_wrapper_template/android/gradlew ai_companion_v0_28/android/gradlew
          cp /tmp/flutter_wrapper_template/android/gradlew.bat ai_companion_v0_28/android/gradlew.bat
          cp /tmp/flutter_wrapper_template/android/gradle/wrapper/gradle-wrapper.jar ai_companion_v0_28/android/gradle/wrapper/gradle-wrapper.jar
          chmod +x ai_companion_v0_28/android/gradlew

      - name: Show build environment
        shell: bash
        run: |
          flutter --version
          java -version
          flutter doctor -v || true

      - name: Resolve Flutter packages
        working-directory: ai_companion_v0_28
        run: flutter pub get

      - name: Build installable checkpoint APK
        working-directory: ai_companion_v0_28
        run: flutter build apk --release

      - name: Verify APK and create SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK='ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          sha256sum "$APK" | tee ai_companion_v0_28/app-release.apk.sha256
          ls -lh "$APK" ai_companion_v0_28/app-release.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-v0.28-Checkpoint-APK
          if-no-files-found: error
          compression-level: 0
          path: |
            ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk
            ai_companion_v0_28/app-release.apk.sha256
