name: Build AI Companion v0.28.3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_companion_v0_28_source.part-*'
      - 'v0281-startup-recovery.patch'
      - 'v0282-android-sqlite-open.patch'
      - 'v0283-tts-chat-recovery.patch'
      - '.github/workflows/build-v028-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Restore verified v0.28 base source
        shell: bash
        run: |
          set -euo pipefail
          ls -lh ai_companion_v0_28_source.part-*
          cat ai_companion_v0_28_source.part-* > ai_companion_v0_28_source.zip
          echo "53d2aefb922c6477087bddb93b44a4b95e7e1a0c4b4bea3e1d9611486c9bbea8 ai_companion_v0_28_source.zip" | sha256sum -c -
          unzip -q ai_companion_v0_28_source.zip
          test -f ai_companion_v0_28/pubspec.yaml
          test -f v0281-startup-recovery.patch
          test -f v0282-android-sqlite-open.patch
          test -f v0283-tts-chat-recovery.patch

      - name: Apply v0.28.1 startup recovery patch
        shell: bash
        working-directory: ai_companion_v0_28
        run: |
          set -euo pipefail
          patch -p1 < ../v0281-startup-recovery.patch
          grep -q '^version: 0.28.1+29$' pubspec.yaml

      - name: Apply v0.28.2 Android SQLite open patch
        shell: bash
        working-directory: ai_companion_v0_28
        run: |
          set -euo pipefail
          patch -p1 < ../v0282-android-sqlite-open.patch
          grep -q '^version: 0.28.2+30$' pubspec.yaml
          python3 tools/validate_v0282_pragma.py

      - name: Apply v0.28.3 TTS/chat recovery patch
        shell: bash
        working-directory: ai_companion_v0_28
        run: |
          set -euo pipefail
          patch -p1 < ../v0283-tts-chat-recovery.patch
          grep -q '^version: 0.28.3+31$' pubspec.yaml
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          assert 'version: 0.28.3+31' in (root / 'pubspec.yaml').read_text()

          gradle = (root / 'android/app/build.gradle.kts').read_text()
          for lib in [
              'libbertvits2.so',
              'libMNN.so',
              'libMNN_Express.so',
              'libMNN_Vulkan.so',
              'libcppjieba.so',
              'libcpptokenizer.so',
          ]:
              assert f'**/{lib}' in gradle, lib
          assert 'keepDebugSymbols' in gradle

          db = (root / 'lib/core/database/app_database.dart').read_text()
          block = db[
              db.index('Future<int> pruneTableByAgeAndCap'):
              db.index('Future<int> pruneCompletedPostTurnJobs')
          ]
          assert "'daily_continuity'" in block
          assert "'window_start'" in block

          chat = (root / 'lib/features/chat/chat_controller.dart').read_text()
          init = chat[
              chat.index('Future<void> initialize()'):
              chat.index('Future<void> reload()')
          ]
          assert 'loading = false;' in init
          assert 'unawaited(_runStartupMaintenanceSafely())' in init
          assert init.index('loading = false;') < init.index(
              'unawaited(_runStartupMaintenanceSafely())'
          )
          assert 'await longMaintenance.maybeRun();' not in init

          settings = (root / 'lib/features/settings/settings_page.dart').read_text()
          assert '测试 API 连接' in settings
          assert 'Duration(seconds: 30)' in settings
          assert "'Reply with OK only.'" in settings

          print('v0.28.3 inline real-device fix validation passed.')
          PY

      - name: Resolve Flutter packages
        working-directory: ai_companion_v0_28
        run: flutter pub get

      - name: Flutter analyze
        working-directory: ai_companion_v0_28
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: ai_companion_v0_28
        run: flutter build apk --release

      - name: Verify Meju native payload stayed byte-identical in APK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, sys, zipfile
          root = pathlib.Path('ai_companion_v0_28')
          apk = root / 'build/app/outputs/flutter-apk/app-release.apk'
          src = root / 'android/app/src/main/jniLibs/arm64-v8a'
          libs = [
              'libbertvits2.so',
              'libMNN.so',
              'libMNN_Express.so',
              'libMNN_Vulkan.so',
              'libcppjieba.so',
              'libcpptokenizer.so',
          ]
          with zipfile.ZipFile(apk) as z:
              for name in libs:
                  source = (src / name).read_bytes()
                  packed = z.read('lib/arm64-v8a/' + name)
                  sh = hashlib.sha256(source).hexdigest()
                  ph = hashlib.sha256(packed).hexdigest()
                  print(name, len(source), sh, 'APK', len(packed), ph)
                  if source != packed:
                      print(f'ERROR: release packaging changed {name}', file=sys.stderr)
                      sys.exit(1)
          print('All 6 Meju native payloads are byte-identical in release APK.')
          PY

      - name: Verify APK and create SHA-256
        shell: bash
        run: |
          set -euo pipefail
          APK='ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk'
          test -s "$APK"
          sha256sum "$APK" | tee ai_companion_v0_28/app-release.apk.sha256
          ls -lh "$APK" ai_companion_v0_28/app-release.apk.sha256

      - name: Upload v0.28.3 checkpoint APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-v0.28.3-TTS-Chat-Recovery-APK
          if-no-files-found: error
          compression-level: 0
          path: |
            ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk
            ai_companion_v0_28/app-release.apk.sha256
