name: Build AI Companion v0.28 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ai_companion_v0_28_source.part-*'
      - '.github/workflows/build-v028-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: '3.44.9'

    - name: Restore source
      shell: bash
      run: |
        set -euo pipefail

        ls -lh ai_companion_v0_28_source.part-*

        cat ai_companion_v0_28_source.part-* > ai_companion_v0_28_source.zip

        echo "53d2aefb922c6477087bddb93b44a4b95e7e1a0c4b4bea3e1d9611486c9bbea8 ai_companion_v0_28_source.zip" | sha256sum -c -

        unzip -q ai_companion_v0_28_source.zip

    - name: Check project
      run: |
        test -f ai_companion_v0_28/pubspec.yaml

    - name: Flutter pub get
      working-directory: ai_companion_v0_28
      run: |
        flutter pub get

    - name: Build APK
      working-directory: ai_companion_v0_28
      run: |
        flutter build apk --release

    - name: APK checksum
      run: |
        sha256sum ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk > apk.sha256

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AI-Companion-v0.28-Checkpoint-APK
        path: |
          ai_companion_v0_28/build/app/outputs/flutter-apk/app-release.apk
          apk.sha256
