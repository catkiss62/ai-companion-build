name: Apply AI Companion v0.30.0 Background Presence

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f app/pubspec.yaml
          grep -q '^version: 0.29.1+35$' app/pubspec.yaml
          test -d app/lib
          test -d app/android
          test -d app/tools
          echo 'Building directly from app/. No bootstrap ZIP or v0.28 patch is used.'

      - name: Apply v0.30.0 source update
        shell: bash
        run: |
          set -euo pipefail
          test -f v0300-background-presence.patch
          git apply --check --directory=app v0300-background-presence.patch
          git apply --directory=app v0300-background-presence.patch
          grep -q '^version: 0.30.0+36$' app/pubspec.yaml
          python3 app/tools/validate_v030_background_presence.py
          echo 'v0.30.0 source update applied to the real app/ tree.'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Install stable AI Companion test signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          printf '%s' '' | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "c5d927a90ef96a12eb858e63e071a2cdd3bd6656446ce8ee07517090dbba9a5d  $HOME/.android/debug.keystore" | sha256sum -c -
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Source and regression validation
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          python3 tools/validate_v030_background_presence.py
          python3 tools/validate_v0291_polish.py
          python3 tools/validate_v029_a2_tts.py
          python3 tools/validate_tts_kotlin_v25.py
          python3 tools/validate_tts_queue_v25.py
          python3 tools/validate_tts_v025.py
          python3 tools/validate_durable_generation_sql.py
          python3 tools/validate_recovery_orchestration_sql.py
          python3 tools/validate_reference_library_sql.py
          python3 tools/validate_awareness_sql.py
          python3 tools/validate_relationship_presentation_sql.py
          python3 tools/validate_memory_v15_sql.py
          python3 tools/validate_proactive_rhythm_v16_sql.py
          python3 tools/validate_daily_continuity_v17_sql.py
          python3 tools/validate_transfer_v18_sql.py
          python3 tools/validate_manual_crypto_v26.py
          python3 tools/validate_preflight_redaction_v27.py

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify release APK native payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, pathlib, sys, zipfile
          root = pathlib.Path('app')
          apk = root / 'build/app/outputs/flutter-apk/app-release.apk'
          src = root / 'android/app/src/main/jniLibs/arm64-v8a'
          libs = [
              'libbertvits2.so', 'libMNN.so', 'libMNN_Express.so',
              'libMNN_Vulkan.so', 'libcppjieba.so', 'libcpptokenizer.so',
          ]
          with zipfile.ZipFile(apk) as z:
              for name in libs:
                  source = (src / name).read_bytes()
                  packed = z.read('lib/arm64-v8a/' + name)
                  if source != packed:
                      print(f'ERROR: release packaging changed {name}', file=sys.stderr)
                      sys.exit(1)
                  print(name, len(source), hashlib.sha256(source).hexdigest())
          bert = (src / 'libbertvits2.so').read_bytes()
          assert hashlib.sha256(bert[:635352]).hexdigest() == 'a1ca5180532aae3a7c378371f6ddb44bbf35d8826a8b8750db4fd12179c5551b'
          assert set(bert[635352:]) <= {0}
          print('A2 original native prefix and APK byte identity verified.')
          PY2

      - name: Create APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          sha256sum "$APK" | tee app/app-release.apk.sha256

      - name: Commit v0.30.0 into app/
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app
          if git diff --cached --quiet; then
            echo 'ERROR: no app/ source changes were staged.' >&2
            exit 1
          fi
          git commit -m 'Promote source to v0.30.0 Background Presence [skip ci]'
          git push

      - name: Upload v0.30.0 update APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-v0.30.0-Background-Presence-Update-APK
          if-no-files-found: error
          compression-level: 0
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/app-release.apk.sha256
