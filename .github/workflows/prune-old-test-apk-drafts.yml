name: Prune superseded test APK drafts
on:
  push:
    branches:
      - maintenance/cleanup-old-apk-drafts-20260927
    paths:
      - .github/workflows/prune-old-test-apk-drafts.yml
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect and prune only superseded APK-only drafts
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXECUTE: "false"
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.request
          base = "https://api.github.com/repos/" + os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          execute = os.environ["EXECUTE"] == "true"
          def api(path, method="GET"):
              req = urllib.request.Request(
                  base + path,
                  headers={
                      "Authorization": "Bearer " + token,
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body) if body else None
          releases = []
          page = 1
          while True:
              batch = api(f"/releases?per_page=100&page={page}")
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          candidates = []
          skipped = []
          for release in releases:
              title = release.get("name") or ""
              match = re.fullmatch(
                  r"AI Companion v\d+\.\d+\.\d+\+(\d+) .+candidate",
                  title, flags=re.I,
              )
              if not release.get("draft") or not match or int(match.group(1)) > 265:
                  continue
              names = [a["name"] for a in release.get("assets", [])]
              forbidden = ("source", "model", "runtime", "signing", "keystore", "pet-source")
              safe = (
                  any(n.lower().endswith(".apk") for n in names)
                  and all(n.lower().endswith((".apk", ".sha256", ".txt")) for n in names)
                  and not any(any(term in n.lower() for term in forbidden) for n in names)
              )
              if safe:
                  candidates.append((release["id"], title))
              else:
                  skipped.append((release["id"], title, names))
          print(f"mode={'DELETE' if execute else 'DRY_RUN'} releases={len(releases)} eligible={len(candidates)} skipped={len(skipped)}", flush=True)
          for release_id, title in candidates:
              print(f"eligible {release_id} {title}", flush=True)
          for release_id, title, names in skipped:
              print(f"SKIPPED {release_id} {title}: {names}", flush=True)
          if execute:
              for release_id, title in candidates:
                  api(f"/releases/{release_id}", method="DELETE")
                  print(f"deleted {release_id} {title}", flush=True)
                  time.sleep(0.5)
              remaining = {r["id"] for r in api("/releases?per_page=100&page=1")}
              if any(release_id in remaining for release_id, _ in candidates):
                  raise RuntimeError("A deleted draft remains on the first page")
              print(f"deleted_count={len(candidates)}", flush=True)
          PY
