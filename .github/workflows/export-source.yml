name: Export private source workspace

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Pack source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='.git' -czf "${RUNNER_TEMP}/ai-companion-source.tgz" .
          sha256sum "${RUNNER_TEMP}/ai-companion-source.tgz"
      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: ai-companion-private-source
          path: ${{ runner.temp }}/ai-companion-source.tgz
          if-no-files-found: error
          retention-days: 1
