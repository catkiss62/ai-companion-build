name: Bootstrap v0.41.53 source tree

on:
  push:
    branches:
      - agent/v04153-genie-multilingual-tts

permissions:
  contents: write

jobs:
  apply-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified non-workflow source patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if grep -Fqx 'version: 0.41.53+192' app/pubspec.yaml; then
            echo 'v0.41.53 source is already present; nothing to bootstrap.'
            exit 0
          fi

          PATCH_ASSET_ID='551771661'
          PATCH_SHA256='a16dad16096738ef85ae174d647c445b1d4c21d0ab21f9bcef1b0030adf17751'
          PATCH_FILE="${RUNNER_TEMP}/AI-Companion-v0.41.53-source.patch"

          gh api --method GET \
            -H 'Accept: application/octet-stream' \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/${PATCH_ASSET_ID}" \
            > "${PATCH_FILE}"
          echo "${PATCH_SHA256}  ${PATCH_FILE}" | sha256sum -c -

          git apply --check --binary \
            --exclude=.github/workflows/build-apk.yml "${PATCH_FILE}"
          git apply --index --binary \
            --exclude=.github/workflows/build-apk.yml "${PATCH_FILE}"
          grep -Fqx 'version: 0.41.53+192' app/pubspec.yaml
          test -f app/android/app/src/main/assets/frontend/english/cmudict.rep.gz
          test -z "$(git ls-files \
            'app/android/app/src/main/assets/benchmark/**' \
            'app/android/app/src/main/assets/openjtalk/**' \
            'app/android/app/src/main/jniLibs/arm64-v8a/libopenjtalk_native.so')"

          python3 app/tools/validate_current_ledger_handoff.py
          git diff --cached --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply v0.41.53 multilingual Genie TTS source'
          git push origin "HEAD:${GITHUB_REF_NAME}"
