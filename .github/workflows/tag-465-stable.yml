name: Mark validated +465 stable baseline
on:
  push:
    branches: [agent/v042107-review-recovery]
    paths: ['app/docs/ledger/AI_Companion_总账_v4.md']
permissions:
  contents: write
jobs:
  tag:
    if: github.event.head_commit.message == 'Record device acceptance for stable +465'
    runs-on: ubuntu-latest
    steps:
      - name: Create stable tag at verified APK source
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/catkiss62/ai-companion-build/git/refs -f ref=refs/tags/v0.42.221-stable -f sha=e4b465972cafcbdc7246c1468866a3d64ab78b90
