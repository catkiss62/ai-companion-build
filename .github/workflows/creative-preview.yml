name: Creative private display probe
on:
  push:
    branches: [agent/v04295-creative-workspace]
    paths:
      - app/android/app/src/main/kotlin/com/aicompanion/localfirst/CreativeWebSandbox.kt
      - app/tools/caicai_smoke/**
      - .github/workflows/creative-preview.yml
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: chmod +x app/android/gradlew && cd app/android && ./gradlew -p ../tools/caicai_smoke connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.catkiss.senlive2dcompanion.smoke.CreativePreviewSmokeTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Creative-preview-results
          path: app/tools/caicai_smoke/build/outputs/androidTest-results/
