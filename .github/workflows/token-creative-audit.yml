name: Token and creative audit validation (no APK)
on:
  push:
    branches: [agent/v042102-token-creative-audit]
    paths: ['app/lib/**', 'app/test/**', 'app/tools/**', '.github/workflows/token-creative-audit.yml']
  workflow_dispatch:
concurrency:
  group: token-creative-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
        working-directory: app
      - name: Creative page bridge failure recovery
        run: node app/tools/test_creative_bridge.mjs
      - name: Full Flutter regression suite including token, creative and restore paths
        run: flutter test
        working-directory: app
