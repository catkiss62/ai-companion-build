name: Build AI Companion v0.37.6+95 APK (Chat Recovery & Presentation)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'AI_Companion_当前总账.md'
      - 'README.md'
      - 'app/README.md'
      - 'app/docs/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-full-build: ${{ steps.scope.outputs.run-full-build }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
      - name: Decide whether this event needs the full APK build
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          request_full_build() {
            echo "run-full-build=true" >> "${GITHUB_OUTPUT}"
            echo "reason=$1" >> "${GITHUB_OUTPUT}"
            echo "Full APK validation required: $1" >> "${GITHUB_STEP_SUMMARY}"
          }

          if test "${EVENT_NAME}" = 'workflow_dispatch'; then
            request_full_build 'manual_dispatch'
            exit 0
          fi
          if test "${EVENT_NAME}" != 'pull_request' || test "${EVENT_ACTION}" != 'synchronize'; then
            request_full_build 'non_synchronize_event'
            exit 0
          fi
          if ! [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] || ! [[ "${AFTER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            request_full_build 'missing_compare_range'
            exit 0
          fi

          changed_files="$(mktemp)"
          if ! gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
            --jq '.files[].filename' > "${changed_files}"; then
            request_full_build 'compare_api_failed'
            exit 0
          fi
          if ! test -s "${changed_files}"; then
            request_full_build 'empty_compare_result'
            exit 0
          fi

          while IFS= read -r changed_path; do
            case "${changed_path}" in
              'AI_Companion_当前总账.md'|'README.md'|'app/README.md'|app/docs/*)
                ;;
              *)
                request_full_build "project_change:${changed_path}"
                exit 0
                ;;
            esac
          done < "${changed_files}"

          echo 'run-full-build=false' >> "${GITHUB_OUTPUT}"
          echo 'reason=documentation_only' >> "${GITHUB_OUTPUT}"
          {
            echo 'Documentation-only synchronization detected.'
            echo 'The full APK build is intentionally skipped; no project source, asset, configuration, or workflow file changed.'
          } >> "${GITHUB_STEP_SUMMARY}"

  build-apk:
    needs: detect-change-scope
    if: ${{ needs.detect-change-scope.outputs.run-full-build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean source baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f app/pubspec.yaml
          grep -q '^version: 0.37.6+95
          grep -q '^  static const int schemaVersion = 30;
          test -d app/lib
          test -d app/android
          test -d app/test
          test -d app/tools
          test ! -f app/android/app/src/main/assets/emotion_model_19emo/model.onnx
          echo 'Building v0.37.6+95 with crash-safe chat recovery, live reasoning and shared presentation state.'

      - name: Restore exact 417-file desktop-pet source pack
        working-directory: app
        run: python3 tools/restore_dafeiyu_asset_pack.py

      - name: Restore pinned LingChat 19-expression presentation assets
        working-directory: app
        run: bash tools/fetch_lingchat_visual_assets.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Restore or create persistent private test signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SIGNING_TAG='ai-companion-private-signing-v1'
          SIGNING_ASSET='AI-Companion-Private-Test-Signing-v1.p12'
          SIGNER_INFO='AI-Companion-Private-Test-Signing-v1.sha256.txt'
          SIGNING_DIR="${RUNNER_TEMP}/ai-companion-signing"
          KEYSTORE="${SIGNING_DIR}/${SIGNING_ASSET}"
          INFO_FILE="${SIGNING_DIR}/${SIGNER_INFO}"
          STORE_PASSWORD='AICompanion_Private_Test_v1_2026!'
          KEY_ALIAS='ai-companion-private-test-v1'
          mkdir -p "${SIGNING_DIR}"

          if gh release view "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${SIGNING_ASSET}" --dir "${SIGNING_DIR}"
            gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${SIGNER_INFO}" --dir "${SIGNING_DIR}"
            test -s "${KEYSTORE}"
            test -s "${INFO_FILE}"
          else
            keytool -genkeypair \
              -storetype PKCS12 \
              -keystore "${KEYSTORE}" \
              -storepass "${STORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keypass "${STORE_PASSWORD}" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname 'CN=AI Companion Private Test,O=Local Development,C=JP'
            SIGNER_SHA256="$(keytool -list -v -keystore "${KEYSTORE}" \
              -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" |
              sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
            test -n "${SIGNER_SHA256}"
            printf 'sha256=%s\n' "${SIGNER_SHA256}" > "${INFO_FILE}"
            gh release create "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --draft \
              --title 'AI Companion private persistent test signing identity v1' \
              --notes 'Private draft only. Deleting this signing asset breaks future APK update continuity. Anyone with repository read access must be treated as able to obtain this test signing identity.'
            gh release upload "${SIGNING_TAG}" "${KEYSTORE}" "${INFO_FILE}" \
              --repo "${GITHUB_REPOSITORY}"
          fi

          chmod 600 "${KEYSTORE}"
          SIGNER_SHA256="$(keytool -list -v -keystore "${KEYSTORE}" \
            -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test -n "${SIGNER_SHA256}"
          grep -Fqx "sha256=${SIGNER_SHA256}" "${INFO_FILE}"
          echo "AI_COMPANION_KEYSTORE_PATH=${KEYSTORE}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_KEYSTORE_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_KEY_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_SIGNER_SHA256=${SIGNER_SHA256}" >> "${GITHUB_ENV}"
          echo "Persistent private test signer ready: ${SIGNER_SHA256}"

      - name: Source and regression validation
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          python3 tools/validate_v0331_desktop_pet_source_parity.py
          python3 tools/validate_v0332_desktop_pet_overlay_d2.py
          python3 tools/validate_current_overlay_menus_unread.py
          python3 tools/validate_v0334_pet_motion_modes_current.py
          python3 tools/validate_v0335_pet_chat_action_arbiter.py
          python3 tools/validate_current_pet_chat_state_finalization.py
          python3 tools/validate_v0337_pet_falling_visual_rollback.py
          python3 tools/validate_v0338_pet_semantic_autonomy.py
          python3 tools/validate_v0339_pet_ambient_motion.py
          python3 tools/validate_v0340_image_messages.py
          python3 tools/validate_current_schema24_a.py
          python3 tools/validate_v0342_personality_appearance.py
          python3 tools/validate_current_lifelike_rules_overlay.py
          python3 tools/validate_v0344_overlay_recovery_diagnostics.py
          python3 tools/validate_v0345_direct_picker_overlay_guard.py
          python3 tools/validate_v0346_lock_visibility_resume.py
          python3 tools/validate_v0347_autonomous_action_foundation.py
          python3 tools/validate_v0348_public_web_discovery.py
          python3 tools/validate_v0349_layered_web_discovery.py
          python3 tools/validate_v0350_personality_trials.py
          python3 tools/validate_v0351_personality_inner_voice.py
          python3 tools/validate_v0352_prompt_workbench.py
          python3 tools/validate_v0353_nsfw_context_router.py
          python3 tools/validate_v0354_prompt_format_chat_ui.py
          python3 tools/validate_v0355_time_perception_diagnostics.py
          python3 tools/validate_v0356_agent_tool_loop.py
          python3 tools/validate_v0357_device_context_router_signing.py
          python3 tools/validate_v0358_native_tool_runtime.py
          python3 tools/validate_v0359_shared_conversation_runtime.py
          python3 tools/validate_v0360_ui_relationship_age.py
          python3 tools/validate_v0361_cross_app_contact.py
          python3 tools/validate_v0362_foreground_tracker_conversation_banner.py
          python3 tools/validate_v0363_hyperos_cover_alarm_guard.py
          python3 tools/validate_current_conversation_foundation.py
          python3 tools/validate_current_chat_visual_stage.py
          python3 tools/validate_v0371_lifelike_emotion_chat.py
          python3 tools/validate_v0372_emotion_crash_hotfix.py
          python3 tools/validate_v0373_expression_visual_parity.py
          python3 tools/validate_v0374_audio_presentation_stabilization.py
          python3 tools/validate_v0375_grounded_emotion_episode.py
          python3 tools/validate_v0322_overlay_time_diagnostics.py
          python3 tools/validate_v0321_ai_to_self.py
          python3 tools/validate_current_schema24_b.py
          python3 tools/validate_v0319_tts_state_cancel_retract.py
          python3 tools/validate_v0318_overlay_stop_stream.py
          python3 tools/validate_v0317_true_stop_generation.py
          python3 tools/validate_v0316_rule_grouping.py
          python3 tools/validate_v0315_live_context_seed.py
          python3 tools/validate_desire_v20_sql.py
          python3 tools/validate_v0314_grounded_desire.py
          python3 tools/validate_current_schema24_c.py
          python3 tools/validate_v031_policy_math.py
          python3 tools/validate_v029_a2_tts.py
          python3 tools/validate_tts_kotlin_v25.py
          python3 tools/validate_tts_queue_v25.py
          python3 tools/validate_tts_v025.py
          python3 tools/validate_durable_generation_sql.py
          python3 tools/validate_recovery_orchestration_sql.py
          python3 tools/validate_reference_library_sql.py
          python3 tools/validate_awareness_sql.py
          python3 tools/validate_relationship_presentation_sql.py
          python3 tools/validate_memory_v15_sql.py
          python3 tools/validate_proactive_rhythm_v16_sql.py
          python3 tools/validate_daily_continuity_v17_sql.py
          python3 tools/validate_transfer_v18_sql.py
          python3 tools/validate_manual_crypto_v26.py
          python3 tools/validate_preflight_redaction_v27.py
          python3 tools/validate_preflight_kotlin_v27.py
          python3 tools/validate_runtime_diagnostic_store_kotlin_v27.py
          python3 tools/validate_v0285_coroutine_proxy_jvm.py
          python3 tools/validate_transfer_kotlin_v26.py

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Kotlin desktop-pet state and physics tests
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest --tests 'com.aicompanion.localfirst.pet.*Test'

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Verify stable APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --print-certs "${APK}" | tee app/app-release.signer.txt
          APK_SIGNER_SHA256="$("${APKSIGNER}" verify --print-certs "${APK}" |
            sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 |
            tr '[:lower:]' '[:upper:]' |
            sed 's/../&:/g;s/:$//')"
          test -n "${APK_SIGNER_SHA256}"
          test "${APK_SIGNER_SHA256}" = "${AI_COMPANION_SIGNER_SHA256}"
          echo "APK signing identity verified: ${APK_SIGNER_SHA256}"

      - name: Verify release APK native and complete pet payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, pathlib, struct, sys, zipfile
          root = pathlib.Path('app')
          apk = root / 'build/app/outputs/flutter-apk/app-release.apk'
          src = root / 'android/app/src/main/jniLibs/arm64-v8a'
          libs = [
              'libbertvits2.so', 'libMNN.so', 'libMNN_Express.so',
              'libMNN_Vulkan.so', 'libcppjieba.so', 'libcpptokenizer.so',
          ]
          with zipfile.ZipFile(apk) as z:
              for name in libs:
                  source = (src / name).read_bytes()
                  packed = z.read('lib/arm64-v8a/' + name)
                  if source != packed:
                      print(f'ERROR: release packaging changed {name}', file=sys.stderr)
                      sys.exit(1)
                  print(name, len(source), hashlib.sha256(source).hexdigest())
              pet_entries = [
                  name for name in z.namelist()
                  if name.startswith('assets/pets/dafeiyu/source/assets/')
                  and not name.endswith('/')
              ]
              if len(pet_entries) != 417:
                  print(f'ERROR: APK contains {len(pet_entries)} source-pack files, expected 417', file=sys.stderr)
                  sys.exit(1)
              print('Complete 417-file pet source pack is present in the APK.')
              forbidden_emotion_payloads = [
                  name for name in z.namelist()
                  if name.startswith('assets/emotion_model_19emo/') and
                     (name.endswith('.onnx') or name.endswith('/vocab.txt') or name.endswith('/label_mapping.json'))
              ]
              if forbidden_emotion_payloads:
                  print(f'ERROR: native 19emo payload unexpectedly present: {forbidden_emotion_payloads}', file=sys.stderr)
                  sys.exit(1)
              ort = [name for name in z.namelist() if 'onnxruntime' in name.lower()]
              if ort:
                  print(f'ERROR: ONNX Runtime unexpectedly present in stability hotfix: {ort}', file=sys.stderr)
                  sys.exit(1)
              print('DeepSeek 19-label contract retained; crash-prone native ONNX runtime is absent.')
              lingchat_entries = [
                  name for name in z.namelist()
                  if name.startswith('assets/flutter_assets/assets/lingchat/')
                  and not name.endswith('/')
                  and not name.endswith('/NOTICE.md')
              ]
              expected_groups = {
                  'deepseek': 21,
                  'background': 2,
                  'effects': 16,
                  'audio': 23,
              }
              for group, expected in expected_groups.items():
                  prefix = f'assets/flutter_assets/assets/lingchat/{group}/'
                  found = [name for name in lingchat_entries if name.startswith(prefix)]
                  if len(found) != expected:
                      print(
                          f'ERROR: APK contains {len(found)} LingChat {group} assets, expected {expected}',
                          file=sys.stderr,
                      )
                      sys.exit(1)
              if len(lingchat_entries) != 62:
                  print(
                      f'ERROR: APK contains {len(lingchat_entries)} LingChat presentation assets, expected 62',
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print('Complete pinned 62-file LingChat presentation pack is present in the APK.')

              yawn_tiers = {
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_187.png': (136, 160),
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_238.png': (171, 202),
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_306.png': (222, 261),
              }
              for name, expected in yawn_tiers.items():
                  data = z.read(name)
                  actual = struct.unpack('>II', data[16:24])
                  if actual != expected:
                      print(f'ERROR: {name} is {actual}, expected {expected}', file=sys.stderr)
                      sys.exit(1)
              yawn_hashes = {
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_187.png': 'dcbbcba4ad2696849fca65eb7b900b76422a3fec805c244de4bc42ec6dfbd235',
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_238.png': 'f6659dc54dead83ad0be851496d3cb784c426c518784f64969606b9010d20096',
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_306.png': '141a88407f5e54c7da795b0c33b5fd5319689b0382b54f2771bec851ae0fa9df',
              }
              for name, expected_hash in yawn_hashes.items():
                  if hashlib.sha256(z.read(name)).hexdigest() != expected_hash:
                      print(f'ERROR: {name} does not match the approved aligned source', file=sys.stderr)
                      sys.exit(1)
              appearance = 'assets/flutter_assets/assets/appearance/dafeiyu_reference.webp'
              appearance_bytes = z.read(appearance)
              if hashlib.sha256(appearance_bytes).hexdigest() != 'f8783e2f468a6b226962b33b34acc26e759416c5ca6175f76138cd7adb5a9c80':
                  print('ERROR: appearance reference bytes changed', file=sys.stderr)
                  sys.exit(1)
              print('Approved three-tier yawn art and appearance reference are present in the APK.')
          bert = (src / 'libbertvits2.so').read_bytes()
          assert hashlib.sha256(bert[:635352]).hexdigest() == 'a1ca5180532aae3a7c378371f6ddb44bbf35d8826a8b8750db4fd12179c5551b'
          assert set(bert[635352:]) <= {0}
          print('A2 original native prefix and APK byte identity verified.')
          PY2

      - name: Create APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          sha256sum "$APK" | tee app/app-release.apk.sha256

      - name: Upload v0.37.6+95 chat recovery APK to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.37.6-chat-recovery-presentation-test'
          APK_NAME='AI-Companion-v0.37.6-95-Chat-Recovery-Presentation-APK.apk'
          SHA_NAME="${APK_NAME}.sha256"
          CI_NAME='AI-Companion-v0.37.6-95-CI-Monitor.txt'
          cp app/build/app/outputs/flutter-apk/app-release.apk "app/${APK_NAME}"
          sed "s#app/build/app/outputs/flutter-apk/app-release.apk#${APK_NAME}#" \
            app/app-release.apk.sha256 > "app/${SHA_NAME}"
          {
            echo 'status=success'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "signer_sha256=${AI_COMPANION_SIGNER_SHA256}"
            cat "app/${SHA_NAME}"
          } > "app/${CI_NAME}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.37.6+95 chat recovery and presentation test candidate' \
              --notes 'Draft-only v0.37.6 candidate: recovers stale cross-process chat leases immediately, treats interrupted replies as stopped without automatic model retry, restores live reasoning in App and overlay, shares the presented-message cursor, and aligns visual defaults and quote rendering. Existing 19-label expression and evidence-grounded emotion episodes remain unchanged; the persistent v1 private test signer is unchanged and schema advances to 30.'
          else
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}"
          fi
          RELEASE_URL="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${RELEASE_URL}" >> "app/${CI_NAME}"
          upload_ok=0
          for attempt in 1 2 3 4; do
            if gh release upload "${TAG}" \
              "app/${APK_NAME}" \
              "app/${SHA_NAME}" \
              "app/${CI_NAME}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"; then
              upload_ok=1
              break
            fi
            echo "Draft Release upload attempt ${attempt}/4 failed; retrying shortly."
            sleep $((attempt * 5))
          done
          test "${upload_ok}" = '1'
          MONITOR_BRANCH='ci-monitor-v0345'
          MONITOR_PATH='.ci/v0375-monitor.txt'
          MONITOR_CONTENT="$(base64 -w0 "app/${CI_NAME}")"
          MONITOR_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}?ref=${MONITOR_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if test -n "${MONITOR_SHA}"; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Update v0.37.6 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
