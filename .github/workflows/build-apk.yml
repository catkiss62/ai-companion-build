            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.37.6+95 chat recovery and presentation test candidate' \
              --notes 'Draft-only v0.37.5 candidate: keeps the v0.37.4 audio/presentation stabilization, strips empty or invalid emotion envelopes without losing body text, and adds evidence-grounded Appraisal to Emotion Episode continuity. The per-turn DeepSeek 19-label expression remains the only avatar/audio authority. Native 19emo remains absent; the persistent v1 private test signer is unchanged and schema advances to 29.'
