              -f sha="${MONITOR_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Create v0.37.6 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" >/dev/null
          fi

