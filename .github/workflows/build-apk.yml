      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Kotlin desktop-pet and overlay text tests
        working-directory: app/android
        run: |
          ./gradlew :app:testDebugUnitTest \
            --tests 'com.aicompanion.localfirst.pet.*Test' \
            --tests 'com.aicompanion.localfirst.OverlayDialogueFormatterTest' \
            --tests 'com.aicompanion.localfirst.HistoricalAnrTraceSanitizerTest' \
            --tests 'com.aicompanion.localfirst.HistoricalNativeTombstoneSanitizerTest' \
            --tests 'com.aicompanion.localfirst.AccessibilityEventLoadShedderTest' \
            --tests 'com.aicompanion.localfirst.MultipartBackupArchiveTest' \
            --tests 'com.aicompanion.localfirst.PrivacyFilterTest' \
            --tests 'com.catkiss62.geniettsbenchmark.AssetIntegrityPolicyTest'

      - name: Flutter analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter tests
        working-directory: app
        run: flutter test

      - name: Build release APK
        working-directory: app
        env:
          # Package the two JNI libraries byte-for-byte from the already
          # device-verified Genie v0.6.4 APK. Rebuilding only the adapter was
          # the remaining binary difference on the failing Japanese path.
          ORG_GRADLE_PROJECT_skipGenieNativeBuild: "true"
        # Genie/OpenJTalk ships one verified arm64 JNI runtime. Asking Flutter
        # for its default 32-bit ABI would make CMake link a nonexistent
        # armeabi-v7a/libopenjtalk_native.so.
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify stable APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --print-certs "${APK}" | tee app/app-release.signer.txt
          APK_SIGNER_SHA256="$("${APKSIGNER}" verify --print-certs "${APK}" |
            sed -n 's/^.*certificate SHA-256 digest: //p' | head -1 |
            tr '[:lower:]' '[:upper:]' |
            sed 's/../&:/g;s/:$//')"
          test -n "${APK_SIGNER_SHA256}"
          test "${APK_SIGNER_SHA256}" = "${AI_COMPANION_SIGNER_SHA256}"
          echo "APK signing identity verified: ${APK_SIGNER_SHA256}"

      - name: Verify release APK Genie and complete pet payloads
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import hashlib, json, pathlib, struct, sys, zipfile
          root = pathlib.Path('app')
          apk = root / 'build/app/outputs/flutter-apk/app-release.apk'
          payload = json.loads(
              pathlib.Path('.genie-payload/extracted-manifest.json').read_text(encoding='utf-8')
          )
          with zipfile.ZipFile(apk) as z:
              for relative, expected in payload.items():
                  packed_path = relative if relative.startswith('assets/') else 'lib/arm64-v8a/' + pathlib.Path(relative).name
                  packed = z.read(packed_path)
                  actual = hashlib.sha256(packed).hexdigest()
                  if len(packed) != expected['size'] or actual != expected['sha256']:
                      print(f'ERROR: release APK Genie payload mismatch: {relative}', file=sys.stderr)
                      sys.exit(1)
              required_genie_libs = {
                  'lib/arm64-v8a/libonnxruntime.so',
                  'lib/arm64-v8a/libopenjtalk_native.so',
                  'lib/arm64-v8a/libgenie_frontend.so',
                  'lib/arm64-v8a/libc++_shared.so',
              }
              missing = sorted(required_genie_libs.difference(z.namelist()))
              if missing:
                  print(f'ERROR: Genie native libraries missing: {missing}', file=sys.stderr)
                  sys.exit(1)
              # The prior package verified the two Japanese JNI libraries byte
              # for byte but omitted OpenJTalk's transitive C++ runtime. Check
              # the actual release APK dependency closure so this cannot recur.
              import re, subprocess, tempfile
              system_libraries = {
                  'libandroid.so', 'libdl.so', 'liblog.so', 'libm.so',
                  'libc.so', 'libz.so',
              }
              packaged_native = {
                  pathlib.PurePosixPath(name).name
                  for name in z.namelist()
                  if name.startswith('lib/arm64-v8a/') and name.endswith('.so')
              }
              with tempfile.TemporaryDirectory() as temporary:
                  for source_name in ('libopenjtalk_native.so', 'libgenie_frontend.so'):
                      source_path = pathlib.Path(temporary) / source_name
                      source_path.write_bytes(z.read(f'lib/arm64-v8a/{source_name}'))
                      dynamic = subprocess.run(
                          ['readelf', '-d', str(source_path)],
                          check=True,
                          capture_output=True,
                          text=True,
                      ).stdout
                      needed = set(re.findall(r'Shared library: \[([^]]+)\]', dynamic))
                      unresolved = sorted(needed - system_libraries - packaged_native)
                      if unresolved:
                          print(
                              f'ERROR: {source_name} has unpackaged ELF dependencies: {unresolved}',
                              file=sys.stderr,
                          )
                          sys.exit(1)
              print('OpenJTalk ELF dependency closure is complete in the release APK.')
              verified_ort = pathlib.Path(
                  '.genie-payload/unpacked/lib/arm64-v8a/libonnxruntime.so'
              ).read_bytes()
              companion_ort = z.read('lib/arm64-v8a/libonnxruntime.so')
              if companion_ort != verified_ort:
                  print('ERROR: companion ONNX Runtime differs from verified Genie APK', file=sys.stderr)
                  sys.exit(1)
              print('ONNX Runtime native library is byte-identical to verified Genie APK.')
              if 'assets/frontend/english/cmudict.rep' not in z.namelist():
                  print('ERROR: production CMUdict frontend asset is missing', file=sys.stderr)
                  sys.exit(1)
              packaged_roberta = [
                  name for name in z.namelist()
                  if 'roberta' in pathlib.Path(name).name.lower()
                  and name.endswith(('.onnx', '.ort'))
              ]
              if packaged_roberta:
                  print(f'ERROR: user-imported RoBERTa leaked into APK: {packaged_roberta}', file=sys.stderr)
                  sys.exit(1)
              forbidden_meju = [
                  name for name in z.namelist()
                  if name.startswith('assets/tts_models/')
                  or name.startswith('assets/legacy_tts/')
                  or pathlib.Path(name).name in {
                      'libbertvits2.so', 'libMNN.so', 'libMNN_Express.so',
                      'libcppjieba.so', 'libcpptokenizer.so',
                  }
              ]
              if forbidden_meju:
                  print(f'ERROR: retired Meju runtime leaked into APK: {forbidden_meju[:8]}', file=sys.stderr)
                  sys.exit(1)
              forbidden_voice_assets = (
                  'naiyou_', 'ref01', 'ref02', 'ref04', 'ref06', 'test_backup'
              )
              if any(
                  any(token in name for token in forbidden_voice_assets)
                  for name in z.namelist()
              ):
                  print('ERROR: Tiandou, Naiyou or test-only voice leaked into APK', file=sys.stderr)
                  sys.exit(1)
              manifest = json.loads(z.read('assets/benchmark/manifest.json'))
              expected_cases = {
                  'jiuhu_idle50',
                  'jiuhu_bento_tools',
                  'jiuhu_dream_days',
                  'jiuhu_devotion',
              }
              actual_cases = {case['id'] for case in manifest['cases']}
              if actual_cases != expected_cases:
                  print(f'ERROR: wrong Jiuhu production cases: {actual_cases}', file=sys.stderr)
                  sys.exit(1)
              expected_reference_inputs = {
                  'ref_seq', 'ref_bert', 'ssl_content', 'ref_audio', 'ge', 'ge_advanced'
              }
              for case in manifest['cases']:
                  actual_inputs = {item['name'] for item in case['tensors']}
                  if actual_inputs != expected_reference_inputs:
                      print(
                          f"ERROR: incomplete Jiuhu V2Pro prompt tensors for {case['id']}: {actual_inputs}",
                          file=sys.stderr,
                      )
                      sys.exit(1)
              integrity = manifest.get('asset_integrity', {})
              for relative, expected in integrity.items():
                  data = z.read('assets/benchmark/' + relative)
                  if len(data) != expected['bytes'] or hashlib.sha256(data).hexdigest() != expected['sha256']:
                      print(f'ERROR: Jiuhu manifest integrity mismatch: {relative}', file=sys.stderr)
                      sys.exit(1)
              print(f'All {len(payload)} Genie/Jiuhu/OpenJTalk payload files are size/hash exact; Tiandou, Naiyou and Meju are absent.')
              pet_entries = [
                  name for name in z.namelist()
                  if name.startswith('assets/pets/dafeiyu/source/assets/')
                  and not name.endswith('/')
              ]
              if len(pet_entries) != 417:
                  print(f'ERROR: APK contains {len(pet_entries)} source-pack files, expected 417', file=sys.stderr)
                  sys.exit(1)
              print('Complete 417-file pet source pack is present in the APK.')
              forbidden_emotion_payloads = [
                  name for name in z.namelist()
                  if name.startswith('assets/emotion_model_19emo/') and
                     (name.endswith('.onnx') or name.endswith('/vocab.txt') or name.endswith('/label_mapping.json'))
              ]
              if forbidden_emotion_payloads:
                  print(f'ERROR: native 19emo payload unexpectedly present: {forbidden_emotion_payloads}', file=sys.stderr)
                  sys.exit(1)
              print('DeepSeek 19-label contract retained; Genie ONNX Runtime is present without 19emo.')
              lingchat_entries = [
                  name for name in z.namelist()
                  if name.startswith('assets/flutter_assets/assets/lingchat/')
                  and not name.endswith('/')
                  and not name.endswith('/NOTICE.md')
              ]
              expected_groups = {
                  'deepseek': 21,
                  'background': 2,
                  'effects': 16,
                  'audio': 23,
              }
              for group, expected in expected_groups.items():
                  prefix = f'assets/flutter_assets/assets/lingchat/{group}/'
                  found = [name for name in lingchat_entries if name.startswith(prefix)]
                  if len(found) != expected:
                      print(
                          f'ERROR: APK contains {len(found)} LingChat {group} assets, expected {expected}',
                          file=sys.stderr,
                      )
                      sys.exit(1)
              if len(lingchat_entries) != 62:
                  print(
                      f'ERROR: APK contains {len(lingchat_entries)} LingChat presentation assets, expected 62',
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print('Complete pinned 62-file LingChat presentation pack is present in the APK.')

              portrait_prefix = 'assets/flutter_assets/assets/portraits/large_whale/'
              portraits = sorted(
                  name for name in z.namelist()
                  if name.startswith(portrait_prefix) and name.endswith('.webp')
              )
              if len(portraits) != 20:
                  print(f'ERROR: APK contains {len(portraits)} large-whale portraits, expected 20', file=sys.stderr)
                  sys.exit(1)
              if z.read(portrait_prefix + 'nervous.webp') != z.read(portrait_prefix + 'flustered.webp'):
                  print('ERROR: approved nervous/flustered shared source changed', file=sys.stderr)
                  sys.exit(1)
              if any(name.startswith('assets/flutter_assets/assets_source/') for name in z.namelist()):
                  print('ERROR: source ZIP was packaged into the APK', file=sys.stderr)
                  sys.exit(1)
              mirror = 'assets/flutter_assets/assets/appearance/large_whale_mirror.jpg'
              if hashlib.sha256(z.read(mirror)).hexdigest() != '3eb20158a962f129adba4d7f732dd5526a2943d4139eea07078ea82c4b0f2071':
                  print('ERROR: untouched large-whale mirror image changed', file=sys.stderr)
                  sys.exit(1)
              avatar = 'assets/flutter_assets/assets/appearance/chat_avatar.webp'
              if hashlib.sha256(z.read(avatar)).hexdigest() != 'f5a5eac2c00fa8c15005adea269ed514d778222b8a005ed38693b51b535eda46':
                  print('ERROR: approved chat avatar changed during APK packaging', file=sys.stderr)
                  sys.exit(1)
              old_avatar = 'assets/flutter_assets/assets/lingchat/deepseek/avatar.webp'
              if hashlib.sha256(z.read(old_avatar)).hexdigest() != '68772d09789c9557509dad6ae64472fe0046b5cf35b91abffb5c3f03c2d0cb00':
                  print('ERROR: preserved LingChat avatar changed', file=sys.stderr)
                  sys.exit(1)
              print('Optimized portraits, new chat avatar, preserved LingChat avatar and mirror are present in the APK.')

              yawn_tiers = {
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_187.png': (136, 160),
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_238.png': (171, 202),
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_306.png': (222, 261),
              }
              for name, expected in yawn_tiers.items():
                  data = z.read(name)
                  actual = struct.unpack('>II', data[16:24])
                  if actual != expected:
                      print(f'ERROR: {name} is {actual}, expected {expected}', file=sys.stderr)
                      sys.exit(1)
              yawn_hashes = {
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_187.png': 'dcbbcba4ad2696849fca65eb7b900b76422a3fec805c244de4bc42ec6dfbd235',
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_238.png': 'f6659dc54dead83ad0be851496d3cb784c426c518784f64969606b9010d20096',
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_306.png': '141a88407f5e54c7da795b0c33b5fd5319689b0382b54f2771bec851ae0fa9df',
              }
              for name, expected_hash in yawn_hashes.items():
                  if hashlib.sha256(z.read(name)).hexdigest() != expected_hash:
                      print(f'ERROR: {name} does not match the approved aligned source', file=sys.stderr)
                      sys.exit(1)
              appearance = 'assets/flutter_assets/assets/appearance/dafeiyu_reference.webp'
              appearance_bytes = z.read(appearance)
              if hashlib.sha256(appearance_bytes).hexdigest() != 'f8783e2f468a6b226962b33b34acc26e759416c5ca6175f76138cd7adb5a9c80':
                  print('ERROR: appearance reference bytes changed', file=sys.stderr)
                  sys.exit(1)
              print('Approved three-tier yawn art and appearance reference are present in the APK.')
          print('Pinned Genie TTS runtime payload and APK byte identity verified.')
          PY2

      - name: Verify bundled tarot JPG payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('app/build/app/outputs/flutter-apk/app-release.apk')
          manifest = Path('app/assets/tarot/rws_major/SHA256SUMS')
          expected = {
              name: digest
              for digest, name in (
                  line.split()
                  for line in manifest.read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )
          }
          assert len(expected) == 22
          with ZipFile(apk) as archive:
              for name, digest in expected.items():
                  path = f'assets/flutter_assets/assets/tarot/rws_major/{name}'
                  actual = sha256(archive.read(path)).hexdigest()
                  assert actual == digest, (path, actual, digest)
          print('All 22 pinned tarot JPGs are present and hash-exact in the APK.')
          PY

      - name: Create APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          sha256sum "$APK" | tee app/app-release.apk.sha256

      - name: Upload v0.41.67+211 APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-v0.41.67-211-Cedar-Toy-MCP-APK
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload v0.41.67+211 APK to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.41.67-cedar-toy-mcp-test'
          APK_NAME='AI-Companion-v0.41.67-211-Cedar-Toy-MCP-APK.apk'
          SHA_NAME="${APK_NAME}.sha256"
          CI_NAME='AI-Companion-v0.41.67-211-Cedar-Toy-MCP-CI-Monitor.txt'
          cp app/build/app/outputs/flutter-apk/app-release.apk "app/${APK_NAME}"
          sed "s#app/build/app/outputs/flutter-apk/app-release.apk#${APK_NAME}#" \
            app/app-release.apk.sha256 > "app/${SHA_NAME}"
          {
            echo 'status=success'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "signer_sha256=${AI_COMPANION_SIGNER_SHA256}"
            cat "app/${SHA_NAME}"
          } > "app/${CI_NAME}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.41.67+211 Cedar Toy MCP candidate' \
              --notes 'Unpublished Draft schema-61 candidate. Adds secure Cedar Toy MCP setup and a real list → guide → play tool chain, keeps internal planning and verification on DeepSeek, and performs only one final Gemini expression call after real tool outcomes are collected. Restores spontaneous search and keeps Snapshot protocol 6. Private packs, credentials, user images, diagnostics, backups and conversation content are not bundled.'
          else
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title 'AI Companion v0.41.67+211 Cedar Toy MCP candidate' \
              --notes 'Unpublished Draft schema-61 candidate. Adds secure Cedar Toy MCP setup and a real list → guide → play tool chain, keeps internal planning and verification on DeepSeek, and performs only one final Gemini expression call after real tool outcomes are collected. Restores spontaneous search and keeps Snapshot protocol 6. Private packs, credentials, user images, diagnostics, backups and conversation content are not bundled.'
          fi
          RELEASE_URL="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${RELEASE_URL}" >> "app/${CI_NAME}"
          upload_ok=0
          for attempt in 1 2 3 4; do
            if gh release upload "${TAG}" \
              "app/${APK_NAME}" \
              "app/${SHA_NAME}" \
              "app/${CI_NAME}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"; then
              upload_ok=1
              break
            fi
            echo "Draft Release upload attempt ${attempt}/4 failed; retrying shortly."
            sleep $((attempt * 5))
          done
          test "${upload_ok}" = '1'
          MONITOR_BRANCH='ci-monitor-v0345'
          MONITOR_PATH='.ci/v04155-monitor.txt'
          MONITOR_CONTENT="$(base64 -w0 "app/${CI_NAME}")"
          MONITOR_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}?ref=${MONITOR_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if test -n "${MONITOR_SHA}"; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Update v0.41.57 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" \
              -f sha="${MONITOR_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Create v0.41.59 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" >/dev/null
          fi

  report-ci-failure:
    needs:
      - detect-change-scope
      - build-apk
    if: ${{ always() && needs.detect-change-scope.outputs.run-full-build == 'true' && needs.build-apk.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Publish failed-job diagnostics to the private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-apk.result }}
        run: |
          set -uo pipefail
          TAG='v0.41.67-cedar-toy-mcp-test'
          CI_NAME='AI-Companion-v0.41.67-211-Cedar-Toy-MCP-CI-Monitor.txt'
          REPORT="${RUNNER_TEMP}/${CI_NAME}"
          JOBS_JSON="${RUNNER_TEMP}/jobs.json"
          {
            echo 'status=failure'
            echo "build_result=${BUILD_RESULT}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo
            echo '=== failed or cancelled job logs ==='
            if gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              > "${JOBS_JSON}" 2>&1 && jq -e '.jobs' "${JOBS_JSON}" >/dev/null 2>&1; then
              jq -r \
                '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | [.id, .name, .conclusion] | @tsv' \
                "${JOBS_JSON}" | while IFS=$'\t' read -r job_id job_name conclusion; do
                  echo
                  echo "--- job=${job_name} conclusion=${conclusion} id=${job_id} ---"
                  JOB_LOG="${RUNNER_TEMP}/job-${job_id}.log"
                  if gh api \
                    --allow-escape-sequences \
                    -H 'Accept: application/vnd.github+json' \
                    "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
                    > "${JOB_LOG}" 2>&1; then
                    tail -n 1200 "${JOB_LOG}"
                  else
                    echo 'Unable to download this completed job log.'
                    tail -n 120 "${JOB_LOG}" 2>/dev/null || true
                  fi
                done
            else
              echo 'Unable to enumerate job logs; raw API response follows.'
              test -f "${JOBS_JSON}" && cat "${JOBS_JSON}"
            fi
          } > "${REPORT}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.41.67+211 Cedar Toy MCP candidate' \
              --notes 'Draft failure diagnostics for the schema-61 Cedar Toy MCP candidate. It is not a published release; private packs, credentials, user images, captions, diagnostics, backups and conversation content are not included in CI assets.'
          fi
          RELEASE_URL="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${RELEASE_URL}" >> "${REPORT}"
          gh release upload "${TAG}" \
            "${REPORT}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
          MONITOR_BRANCH='ci-monitor-v0345'
          MONITOR_PATH='.ci/v04155-monitor.txt'
          MONITOR_CONTENT="$(base64 -w0 "${REPORT}")"
          MONITOR_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}?ref=${MONITOR_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if test -n "${MONITOR_SHA}"; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Update v0.41.59 CI failure monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" \
              -f sha="${MONITOR_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Create v0.41.57 CI failure monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" >/dev/null
          fi
