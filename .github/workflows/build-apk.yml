      - agent/v04139-web-reading-learning-roleplay-image
      - agent/v04143-phase3b-question-autonomy
      - agent/v04144-autonomy-arbitration-rework
      - agent/v04145-sticker-expression
      - agent/v04146-sticker-agent-continuation-identity
      - agent/v04147-user-sticker-picker-image-send
      - agent/v04148-agent-image-reliability-hotfix
      - agent/v04149-subjective-search-humor-restoration
      - agent/v04150-agent-v2-bounded-loop
      - agent/v04151-sticker-semantics-gallery-interop
      - agent/v04152-diary-fresh-topic-balance
      - agent/v04153-genie-multilingual-tts
      - agent/v04154-genie-tts-hotfix-settings
      - agent/v04155-genie-direct-port-lazy-language
      - agent/v04159-tiandou-pitch-recovery
      - agent/v04160-jiuhu-four-voice-auto-fix
      - agent/v04161-shuaiapi-immersive-language-reasoning
      - agent/v04162-hybrid-final-fallback
      - agent/v04163-immersive-tts-settings-hardening
      - agent/v04164-settings-rollback
      - agent/v04165-refresh-settings-phone-media
      - agent/v04166-phase3c-refresh-notes-wishlist
      - agent/v04167-cedar-toy-mcp
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'AI_Companion_当前总账.md'
      - 'README.md'
      - 'app/README.md'
      - 'app/docs/**'

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-companion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-ledger:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconcile oversized project ledger when requested
        if: ${{ hashFiles('app/tools/reconcile_v04155_build199_ledger.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 app/tools/reconcile_v04155_build199_ledger.py
          python3 app/tools/validate_current_ledger_handoff.py
          rm app/tools/reconcile_v04155_build199_ledger.py
          git config user.name 'catkiss62'
          git config user.email 'aolu0610@gmail.com'
          git add AI_Companion_当前总账.md app/tools/reconcile_v04155_build199_ledger.py
          git commit -m 'docs: reconcile build 199 project ledger [skip ci]'
          git push origin "HEAD:${GITHUB_REF_NAME}"

  detect-change-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-full-build: ${{ steps.scope.outputs.run-full-build }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
      - name: Decide whether this event needs the full APK build
        id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail

          request_full_build() {
            echo "run-full-build=true" >> "${GITHUB_OUTPUT}"
            echo "reason=$1" >> "${GITHUB_OUTPUT}"
            echo "Full APK validation required: $1" >> "${GITHUB_STEP_SUMMARY}"
          }

          if test "${EVENT_NAME}" = 'workflow_dispatch'; then
            request_full_build 'manual_dispatch'
            exit 0
          fi
          if test "${EVENT_NAME}" = 'push'; then
            :
          elif test "${EVENT_NAME}" = 'pull_request' && test "${EVENT_ACTION}" = 'synchronize'; then
            :
          else
            request_full_build 'non_synchronize_event'
            exit 0
          fi
          if ! [[ "${BEFORE_SHA}" =~ ^[0-9a-f]{40}$ ]] || ! [[ "${AFTER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            request_full_build 'missing_compare_range'
            exit 0
          fi

          changed_files="$(mktemp)"
          if ! gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${AFTER_SHA}" \
            --jq '.files[].filename' > "${changed_files}"; then
            request_full_build 'compare_api_failed'
            exit 0
          fi
          if ! test -s "${changed_files}"; then
            request_full_build 'empty_compare_result'
            exit 0
          fi

          if grep -Fqx 'app/tools/reconcile_v04155_build199_ledger.py' "${changed_files}"; then
            while IFS= read -r changed_path; do
              case "${changed_path}" in
                'app/tools/reconcile_v04155_build199_ledger.py'|'.github/workflows/build-apk.yml'|'AI_Companion_当前总账.md'|'README.md'|'app/README.md'|app/docs/*)
                  ;;
                *)
                  request_full_build "ledger_reconcile_with_project_change:${changed_path}"
                  exit 0
                  ;;
              esac
            done < "${changed_files}"
            echo 'run-full-build=false' >> "${GITHUB_OUTPUT}"
            echo 'reason=oversized_ledger_reconciliation' >> "${GITHUB_OUTPUT}"
            echo 'Oversized-ledger bookkeeping only; the validated APK source is unchanged.' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          while IFS= read -r changed_path; do
            case "${changed_path}" in
              'AI_Companion_当前总账.md'|'README.md'|'app/README.md'|app/docs/*)
                ;;
              *)
                request_full_build "project_change:${changed_path}"
                exit 0
                ;;
            esac
          done < "${changed_files}"

          echo 'run-full-build=false' >> "${GITHUB_OUTPUT}"
          echo 'reason=documentation_only' >> "${GITHUB_OUTPUT}"
          {
            echo 'Documentation-only synchronization detected.'
            echo 'The full APK build is intentionally skipped; no project source, asset, configuration, or workflow file changed.'
          } >> "${GITHUB_STEP_SUMMARY}"

  build-apk:
    needs: detect-change-scope
    if: ${{ needs.detect-change-scope.outputs.run-full-build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore exact validated Genie TTS v0.7.6 Jiuhu runtime payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          GENIE_TAG='genie-tts-private-runtime-v0.7.6-jiuhu'
          GENIE_APK='Genie-TTS-Android-v0.7.6-Jiuhu-4-candidates-test.apk'
          GENIE_APK_SHA256='af90aeaf84afdb383bd71584a5512609666c9af38110ea192ebde6f2c84ceb43'
          FRONTEND_TAG='genie-tts-private-runtime-v0.6.4'
          FRONTEND_APK='Genie-TTS-v0.6.4-Verified.apk'
          FRONTEND_SHA='Genie-TTS-v0.6.4-Verified.apk.sha256'
          mkdir -p .genie-payload/unpacked
          # GitHub's release-by-tag endpoint returns 404 for an unpublished
          # draft, even though authenticated release-list calls can see it.
          # Resolve the private draft by tag_name, then download each asset by
          # its authenticated release-asset ID without publishing the model.
          GENIE_RELEASE_ID="$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${GENIE_TAG}\") | .id" | head -1)"
          test -n "${GENIE_RELEASE_ID}"
          GENIE_ASSET_ID="$(gh api \
            "/repos/${GITHUB_REPOSITORY}/releases/${GENIE_RELEASE_ID}/assets?per_page=100" \
            --jq ".[] | select(.name == \"${GENIE_APK}\") | .id")"
          test -n "${GENIE_ASSET_ID}"
          gh api --method GET \
            -H 'Accept: application/octet-stream' \
            "/repos/${GITHUB_REPOSITORY}/releases/assets/${GENIE_ASSET_ID}" \
            > ".genie-payload/${GENIE_APK}"
          echo "${GENIE_APK_SHA256}  .genie-payload/${GENIE_APK}" | sha256sum -c -
          # The v0.7.6 Jiuhu candidate APK intentionally carries only the
          # acoustic pack. Keep the already built-and-verified multilingual
          # OpenJTalk dictionary/JNI adapter as a separate pinned dependency;
          # never extract its retired Tiandou benchmark into this build.
          FRONTEND_RELEASE_ID="$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${FRONTEND_TAG}\") | .id" | head -1)"
          test -n "${FRONTEND_RELEASE_ID}"
          for FRONTEND_ASSET in "${FRONTEND_APK}" "${FRONTEND_SHA}"; do
            FRONTEND_ASSET_ID="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/releases/${FRONTEND_RELEASE_ID}/assets?per_page=100" \
              --jq ".[] | select(.name == \"${FRONTEND_ASSET}\") | .id")"
            test -n "${FRONTEND_ASSET_ID}"
            gh api --method GET \
              -H 'Accept: application/octet-stream' \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${FRONTEND_ASSET_ID}" \
              > ".genie-payload/${FRONTEND_ASSET}"
          done
          sed "s#  ${FRONTEND_APK}#  .genie-payload/${FRONTEND_APK}#" \
            ".genie-payload/${FRONTEND_SHA}" | sha256sum -c -
          unzip -q ".genie-payload/${GENIE_APK}" \
            'assets/benchmark_jiuhu/*' \
            'lib/arm64-v8a/libonnxruntime.so' \
            -d .genie-payload/unpacked
          # Keep the pinned Jiuhu ORT only as the post-build byte-identity
          # reference. The app dependency still supplies the packaged library.
          unzip -q ".genie-payload/${FRONTEND_APK}" \
            'assets/openjtalk/*' \
            'lib/arm64-v8a/libopenjtalk_native.so' \
            'lib/arm64-v8a/libgenie_frontend.so' \
            'lib/arm64-v8a/libc++_shared.so' \
            -d .genie-payload/unpacked
          python3 - <<'PY'
          import hashlib, json, pathlib

          root = pathlib.Path('.genie-payload/unpacked/assets/benchmark_jiuhu')
          path = root / 'manifest.json'
          manifest = json.loads(path.read_text(encoding='utf-8'))
          expected_models = {
              'models/t2s_encoder_fp32.bin': (11465732, '2729a0bc3bfa297b86dae07190f010653806a5f466ffe654a7cd9291445ee986'),
              'models/t2s_encoder_fp32.onnx': (14568, 'f6eb1acd47c8e6d36b777886981a49122e8e070a5eb9888d458fb188dc139f75'),
              'models/t2s_first_stage_decoder_fp32.onnx': (416803, '868f395999508905128c5325c5db4f4b37b2e70e04d6e2719fec64cbb60ee7f9'),
              'models/t2s_shared_fp32.bin': (306827268, '07c40df473ddb08e259357ddf17173ffc3f82ce1a3e208cd1dd438f0dd01c445'),
              'models/t2s_stage_decoder_fp32.onnx': (417625, '3f02881c517423deb610f86d5441bd9825937c5069f3887cacefa1e9dc403b0d'),
              'models/vits_fp32.bin': (175582720, 'bfd6558dee03e06fafa2225d906f27e0f303395951d8cc4b8f2b26b3da2e99c2'),
              'models/vits_fp32.onnx': (1654702, 'ce3495f0cd976270274d0f5c68377acb10e7347ca03e86346a42a0a99e769168'),
          }
          assert manifest['models'] == {
              'encoder': 'models/t2s_encoder_fp32.onnx',
              'first_decoder': 'models/t2s_first_stage_decoder_fp32.onnx',
              'stage_decoder': 'models/t2s_stage_decoder_fp32.onnx',
              'vocoder': 'models/vits_fp32.onnx',
          }

          def sha256(candidate):
              digest = hashlib.sha256()
              with candidate.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          source_integrity = manifest.get('asset_integrity', {})
          for relative, expected in expected_models.items():
              candidate = root / relative
              expected_bytes, expected_sha = expected
              assert candidate.stat().st_size == expected_bytes, relative
              assert sha256(candidate) == expected_sha, relative
              declared = source_integrity.get(relative, {})
              assert declared.get('bytes') == expected_bytes, relative
              assert declared.get('sha256') == expected_sha, relative
          production_ids = {
              'jiuhu_idle50',
              'jiuhu_bento_tools',
              'jiuhu_dream_days',
              'jiuhu_devotion',
          }
          cases = [case for case in manifest['cases'] if case.get('id') in production_ids]
          assert {case['id'] for case in cases} == production_ids
          for case in cases:
              case.pop('reference_audio', None)
              case.pop('feature_tensors', None)
          manifest['cases'] = cases
          manifest['presets'] = []
          manifest['feature_modes'] = []

          def strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for item in value.values():
                      yield from strings(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from strings(item)

          referenced = set(strings({
              key: value for key, value in manifest.items() if key != 'asset_files'
          }))
          external_roberta = manifest['frontend']['roberta']
          for candidate in tuple(root.rglob('*')):
              if not candidate.is_file() or candidate == path:
                  continue
              relative = candidate.relative_to(root).as_posix()
              # Keep only the seven exact model assets whose graph/data hashes
              # were validated above. In particular, reject interrupted atomic
              # write remnants such as models/.vits_fp32.bin.* rather than
              # copying every file found under models/ into the production APK.
              if (
                  relative == external_roberta
                  or (relative.startswith('models/') and relative not in expected_models)
                  or (not relative.startswith('models/') and relative not in referenced)
              ):
                  candidate.unlink()
          for directory in sorted(
              (candidate for candidate in root.rglob('*') if candidate.is_dir()),
              key=lambda candidate: len(candidate.parts),
              reverse=True,
          ):
              try:
                  directory.rmdir()
              except OSError:
                  pass
          manifest['asset_files'] = sorted(
              candidate.relative_to(root).as_posix()
              for candidate in root.rglob('*')
              if candidate.is_file() and candidate != path
          ) + ['manifest.json']
          expected_reference_inputs = {
              'ref_seq', 'ref_bert', 'ssl_content', 'ref_audio', 'ge', 'ge_advanced'
          }
          for case in cases:
              actual_inputs = {item['name'] for item in case['tensors']}
              assert actual_inputs == expected_reference_inputs, (
                  f"incomplete Jiuhu V2Pro prompt tensors: {case['id']} {actual_inputs}"
              )
          actual_models = {
              candidate.relative_to(root).as_posix()
              for candidate in (root / 'models').iterdir()
              if candidate.is_file()
          }
          assert actual_models == set(expected_models), actual_models
          prompt_signatures = {}
          independent_prompt_names = {'ssl_content', 'ref_audio', 'ge', 'ge_advanced'}
          for case in cases:
              signature = tuple(
                  sha256(root / item['file'])
                  for item in case['tensors']
                  if item['name'] in independent_prompt_names
              )
              assert len(signature) == len(independent_prompt_names), case['id']
              prompt_signatures[case['id']] = signature
          assert len(set(prompt_signatures.values())) == len(cases), prompt_signatures

          manifest['asset_integrity'] = {
              relative: {
                  'bytes': (root / relative).stat().st_size,
                  'sha256': sha256(root / relative),
              }
              for relative in manifest['asset_files']
              if relative != 'manifest.json'
          }
          path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2),
              encoding='utf-8',
          )
          assert not any(
              token in candidate.as_posix().lower()
              for candidate in root.rglob('*')
              for token in ('naiyou_', 'ref01', 'ref02', 'ref04', 'ref06', 'test_backup')
          )
          print('Curated paired Jiuhu GPT/T2S + SoVITS/VITS runtime and four independent candidates; discarded model temp remnants.')
          PY
          TTS_MAIN='app/android/app/src/main'
          mkdir -p "${TTS_MAIN}/assets" "${TTS_MAIN}/jniLibs/arm64-v8a"
          cp -a .genie-payload/unpacked/assets/benchmark_jiuhu "${TTS_MAIN}/assets/benchmark"
          cp -a .genie-payload/unpacked/assets/openjtalk "${TTS_MAIN}/assets/"
          cp .genie-payload/unpacked/lib/arm64-v8a/libopenjtalk_native.so \
            "${TTS_MAIN}/jniLibs/arm64-v8a/"
          cp .genie-payload/unpacked/lib/arm64-v8a/libgenie_frontend.so \
            "${TTS_MAIN}/jniLibs/arm64-v8a/"
          cp .genie-payload/unpacked/lib/arm64-v8a/libc++_shared.so \
            "${TTS_MAIN}/jniLibs/arm64-v8a/"
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path('app/android/app/src/main')
          files = [
              path for base in (root / 'assets' / 'benchmark', root / 'assets' / 'openjtalk')
              for path in base.rglob('*') if path.is_file()
          ]
          files.append(root / 'jniLibs/arm64-v8a/libopenjtalk_native.so')
          files.append(root / 'jniLibs/arm64-v8a/libgenie_frontend.so')
          files.append(root / 'jniLibs/arm64-v8a/libc++_shared.so')
          manifest = {
              str(path.relative_to(root)): {
                  'size': path.stat().st_size,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              for path in files
          }
          pathlib.Path('.genie-payload/extracted-manifest.json').write_text(
              json.dumps(manifest, sort_keys=True), encoding='utf-8'
          )
          print(f'Restored {len(manifest)} curated Genie/OpenJTalk payload files.')
          PY

      - name: Verify clean source baseline
        shell: bash
        run: |
          set -euo pipefail
          test -f app/pubspec.yaml
          grep -Fqx 'version: 0.41.67+211' app/pubspec.yaml
          grep -Fqx '  static const int schemaVersion = 61;' app/lib/core/database/app_database.dart
          test -d app/lib
          test -d app/android
          test -d app/test
          test -d app/tools
          test ! -f app/android/app/src/main/assets/emotion_model_19emo/model.onnx
          test -f app/android/app/src/main/assets/benchmark/manifest.json
          test -n "$(find app/android/app/src/main/assets/benchmark/models -maxdepth 1 -type f -name '*.onnx' -print -quit)"
          test -f app/android/app/src/main/jniLibs/arm64-v8a/libopenjtalk_native.so
          test -f app/android/app/src/main/jniLibs/arm64-v8a/libgenie_frontend.so
          test -f app/android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          test ! -d app/android/app/src/main/assets/tts_models
          test ! -d app/android/app/src/main/assets/legacy_tts
          echo 'Building v0.41.67+211 Cedar Toy MCP candidate.'

      - name: Restore exact 417-file desktop-pet source pack
        working-directory: app
        run: python3 tools/restore_dafeiyu_asset_pack.py

      - name: Restore pinned LingChat 19-expression presentation assets
        working-directory: app
        run: bash tools/fetch_lingchat_visual_assets.sh

      - name: Restore pinned 22-card Rider-Waite-Smith tarot JPG pack
        working-directory: app
        run: bash tools/fetch_tarot_assets.sh

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.9'

      - name: Restore or create persistent private test signing identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AI_COMPANION_SIGNING_PASSWORD: ${{ secrets.AI_COMPANION_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          SIGNING_TAG='ai-companion-private-signing-v1'
          SIGNING_ASSET='AI-Companion-Private-Test-Signing-v1.p12'
          SIGNER_INFO='AI-Companion-Private-Test-Signing-v1.sha256.txt'
          SIGNING_DIR="${RUNNER_TEMP}/ai-companion-signing"
          KEYSTORE="${SIGNING_DIR}/${SIGNING_ASSET}"
          INFO_FILE="${SIGNING_DIR}/${SIGNER_INFO}"
          STORE_PASSWORD="${AI_COMPANION_SIGNING_PASSWORD:?missing AI_COMPANION_SIGNING_PASSWORD repository secret}"
          KEY_ALIAS='ai-companion-private-test-v1'
          mkdir -p "${SIGNING_DIR}"

          if gh release view "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${SIGNING_ASSET}" --dir "${SIGNING_DIR}"
            gh release download "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern "${SIGNER_INFO}" --dir "${SIGNING_DIR}"
            test -s "${KEYSTORE}"
            test -s "${INFO_FILE}"
          else
            keytool -genkeypair \
              -storetype PKCS12 \
              -keystore "${KEYSTORE}" \
              -storepass "${STORE_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keypass "${STORE_PASSWORD}" \
              -keyalg RSA \
              -keysize 3072 \
              -validity 10000 \
              -dname 'CN=AI Companion Private Test,O=Local Development,C=JP'
            SIGNER_SHA256="$(keytool -list -v -keystore "${KEYSTORE}" \
              -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" |
              sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
            test -n "${SIGNER_SHA256}"
            printf 'sha256=%s\n' "${SIGNER_SHA256}" > "${INFO_FILE}"
            gh release create "${SIGNING_TAG}" --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" --draft \
              --title 'AI Companion private persistent test signing identity v1' \
              --notes 'Private draft only. Deleting this signing asset breaks future APK update continuity. Anyone with repository read access must be treated as able to obtain this test signing identity.'
            gh release upload "${SIGNING_TAG}" "${KEYSTORE}" "${INFO_FILE}" \
              --repo "${GITHUB_REPOSITORY}"
          fi

          chmod 600 "${KEYSTORE}"
          SIGNER_SHA256="$(keytool -list -v -keystore "${KEYSTORE}" \
            -storepass "${STORE_PASSWORD}" -alias "${KEY_ALIAS}" |
            sed -n 's/^[[:space:]]*SHA256: //p' | head -1)"
          test -n "${SIGNER_SHA256}"
          grep -Fqx "sha256=${SIGNER_SHA256}" "${INFO_FILE}"
          echo "AI_COMPANION_KEYSTORE_PATH=${KEYSTORE}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_KEYSTORE_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_KEY_ALIAS=${KEY_ALIAS}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_KEY_PASSWORD=${STORE_PASSWORD}" >> "${GITHUB_ENV}"
          echo "AI_COMPANION_SIGNER_SHA256=${SIGNER_SHA256}" >> "${GITHUB_ENV}"
          echo "Persistent private test signer ready: ${SIGNER_SHA256}"

      - name: Source and regression validation
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          python3 tools/validate_v04128_immersive_identity_rendering.py
          python3 tools/validate_v04129_proactive_rendering_rule_editor_emotion.py
          python3 tools/validate_v04130_presentation_ablation_upload_diagnostics.py
          python3 tools/validate_v04131_phase2a5_verifier_anr_diagnostics.py
          python3 tools/validate_v04132_phase2b_learning_association.py
          python3 tools/validate_v04133_competence_curation_emotion.py
          python3 tools/validate_v04134_memory_grounding_agent_foundation.py
          python3 tools/validate_v04135_interrupted_turn_system_command.py
          python3 tools/validate_v04136_immersive_boundary_stop_style.py
          python3 tools/validate_v04137_memory_lifecycle.py
          python3 tools/validate_v04138_worldbook_roleplay.py
