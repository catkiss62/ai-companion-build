              ]
              expected_groups = {
                  'deepseek': 21,
                  'background': 2,
                  'effects': 16,
                  'audio': 23,
              }
              for group, expected in expected_groups.items():
                  prefix = f'assets/flutter_assets/assets/lingchat/{group}/'
                  found = [name for name in lingchat_entries if name.startswith(prefix)]
                  if len(found) != expected:
                      print(
                          f'ERROR: APK contains {len(found)} LingChat {group} assets, expected {expected}',
                          file=sys.stderr,
                      )
                      sys.exit(1)
              if len(lingchat_entries) != 62:
                  print(
                      f'ERROR: APK contains {len(lingchat_entries)} LingChat presentation assets, expected 62',
                      file=sys.stderr,
                  )
                  sys.exit(1)
              print('Complete pinned 62-file LingChat presentation pack is present in the APK.')

              portrait_prefix = 'assets/flutter_assets/assets/portraits/large_whale/'
              portraits = sorted(
                  name for name in z.namelist()
                  if name.startswith(portrait_prefix) and name.endswith('.webp')
              )
              if len(portraits) != 20:
                  print(f'ERROR: APK contains {len(portraits)} large-whale portraits, expected 20', file=sys.stderr)
                  sys.exit(1)
              if z.read(portrait_prefix + 'nervous.webp') != z.read(portrait_prefix + 'flustered.webp'):
                  print('ERROR: approved nervous/flustered shared source changed', file=sys.stderr)
                  sys.exit(1)
              if any(name.startswith('assets/flutter_assets/assets_source/') for name in z.namelist()):
                  print('ERROR: source ZIP was packaged into the APK', file=sys.stderr)
                  sys.exit(1)
              mirror = 'assets/flutter_assets/assets/appearance/large_whale_mirror.jpg'
              if hashlib.sha256(z.read(mirror)).hexdigest() != '3eb20158a962f129adba4d7f732dd5526a2943d4139eea07078ea82c4b0f2071':
                  print('ERROR: untouched large-whale mirror image changed', file=sys.stderr)
                  sys.exit(1)
              avatar = 'assets/flutter_assets/assets/appearance/chat_avatar.webp'
              if hashlib.sha256(z.read(avatar)).hexdigest() != 'f5a5eac2c00fa8c15005adea269ed514d778222b8a005ed38693b51b535eda46':
                  print('ERROR: approved chat avatar changed during APK packaging', file=sys.stderr)
                  sys.exit(1)
              old_avatar = 'assets/flutter_assets/assets/lingchat/deepseek/avatar.webp'
              if hashlib.sha256(z.read(old_avatar)).hexdigest() != '68772d09789c9557509dad6ae64472fe0046b5cf35b91abffb5c3f03c2d0cb00':
                  print('ERROR: preserved LingChat avatar changed', file=sys.stderr)
                  sys.exit(1)
              print('Optimized portraits, new chat avatar, preserved LingChat avatar and mirror are present in the APK.')

              yawn_tiers = {
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_187.png': (136, 160),
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_238.png': (171, 202),
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_306.png': (222, 261),
              }
              for name, expected in yawn_tiers.items():
                  data = z.read(name)
                  actual = struct.unpack('>II', data[16:24])
                  if actual != expected:
                      print(f'ERROR: {name} is {actual}, expected {expected}', file=sys.stderr)
                      sys.exit(1)
              yawn_hashes = {
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_187.png': 'dcbbcba4ad2696849fca65eb7b900b76422a3fec805c244de4bc42ec6dfbd235',
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_238.png': 'f6659dc54dead83ad0be851496d3cb784c426c518784f64969606b9010d20096',
                  'assets/pets/dafeiyu/source/runtime_overrides/yawning/sleepy_yawn_306.png': '141a88407f5e54c7da795b0c33b5fd5319689b0382b54f2771bec851ae0fa9df',
              }
              for name, expected_hash in yawn_hashes.items():
                  if hashlib.sha256(z.read(name)).hexdigest() != expected_hash:
                      print(f'ERROR: {name} does not match the approved aligned source', file=sys.stderr)
                      sys.exit(1)
              appearance = 'assets/flutter_assets/assets/appearance/dafeiyu_reference.webp'
              appearance_bytes = z.read(appearance)
              if hashlib.sha256(appearance_bytes).hexdigest() != 'f8783e2f468a6b226962b33b34acc26e759416c5ca6175f76138cd7adb5a9c80':
                  print('ERROR: appearance reference bytes changed', file=sys.stderr)
                  sys.exit(1)
              print('Approved three-tier yawn art and appearance reference are present in the APK.')
          print('Upgraded Meju native libraries and APK byte identity verified.')
          PY2

      - name: Verify bundled tarot JPG payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path('app/build/app/outputs/flutter-apk/app-release.apk')
          manifest = Path('app/assets/tarot/rws_major/SHA256SUMS')
          expected = {
              name: digest
              for digest, name in (
                  line.split()
                  for line in manifest.read_text(encoding='utf-8').splitlines()
                  if line.strip()
              )
          }
          assert len(expected) == 22
          with ZipFile(apk) as archive:
              for name, digest in expected.items():
                  path = f'assets/flutter_assets/assets/tarot/rws_major/{name}'
                  actual = sha256(archive.read(path)).hexdigest()
                  assert actual == digest, (path, actual, digest)
          print('All 22 pinned tarot JPGs are present and hash-exact in the APK.')
          PY

      - name: Create APK checksum
        shell: bash
        run: |
          set -euo pipefail
          APK='app/build/app/outputs/flutter-apk/app-release.apk'
          sha256sum "$APK" | tee app/app-release.apk.sha256

      - name: Upload v0.41.13+152 APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Companion-v0.41.13-152-Phase01-Time-Audit-Hardening-APK
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload v0.41.13+152 Phase 0+1 Time Audit Hardening APK to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.41.13-phase01-time-audit-hardening-test'
          APK_NAME='AI-Companion-v0.41.13-152-Phase01-Time-Audit-Hardening-APK.apk'
          SHA_NAME="${APK_NAME}.sha256"
          CI_NAME='AI-Companion-v0.41.13-152-Phase01-Time-Audit-Hardening-CI-Monitor.txt'
          cp app/build/app/outputs/flutter-apk/app-release.apk "app/${APK_NAME}"
          sed "s#app/build/app/outputs/flutter-apk/app-release.apk#${APK_NAME}#" \
            app/app-release.apk.sha256 > "app/${SHA_NAME}"
          {
            echo 'status=success'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "signer_sha256=${AI_COMPANION_SIGNER_SHA256}"
            cat "app/${SHA_NAME}"
          } > "app/${CI_NAME}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.41.13+152 Phase 0+1 Time Audit Hardening candidate' \
              --notes 'Draft candidate: Phase 0+1 legacy Memory/Relationship bypasses, direct-feedback provenance and proposition boundaries are hardened without opening Phase 2. Ordinary and proactive chat use a 30-minute real-user/interaction dual clock with one detailed injection and bounded activity judgment. Immersive-room Session continuity is unchanged. SQLite schema 42; backup protocol remains 5.'
          else
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}"
          fi
          RELEASE_URL="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${RELEASE_URL}" >> "app/${CI_NAME}"
          upload_ok=0
          for attempt in 1 2 3 4; do
            if gh release upload "${TAG}" \
              "app/${APK_NAME}" \
              "app/${SHA_NAME}" \
              "app/${CI_NAME}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"; then
              upload_ok=1
              break
            fi
            echo "Draft Release upload attempt ${attempt}/4 failed; retrying shortly."
            sleep $((attempt * 5))
          done
          test "${upload_ok}" = '1'
          MONITOR_BRANCH='ci-monitor-v0345'
          MONITOR_PATH='.ci/v04113-monitor.txt'
          MONITOR_CONTENT="$(base64 -w0 "app/${CI_NAME}")"
          MONITOR_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}?ref=${MONITOR_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if test -n "${MONITOR_SHA}"; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Update v0.41.13 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" \
              -f sha="${MONITOR_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Create v0.41.13 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" >/dev/null
          fi

  report-ci-failure:
    needs:
      - detect-change-scope
      - build-apk
    if: ${{ always() && needs.detect-change-scope.outputs.run-full-build == 'true' && needs.build-apk.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Publish failed-job diagnostics to the private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-apk.result }}
        run: |
          set -uo pipefail
          TAG='v0.41.13-phase01-time-audit-hardening-test'
          CI_NAME='AI-Companion-v0.41.13-152-Phase01-Time-Audit-Hardening-CI-Monitor.txt'
          REPORT="${RUNNER_TEMP}/${CI_NAME}"
          JOBS_JSON="${RUNNER_TEMP}/jobs.json"
          {
            echo 'status=failure'
            echo "build_result=${BUILD_RESULT}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo
            echo '=== failed or cancelled job logs ==='
            if gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              > "${JOBS_JSON}" 2>&1 && jq -e '.jobs' "${JOBS_JSON}" >/dev/null 2>&1; then
              jq -r \
                '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | [.id, .name, .conclusion] | @tsv' \
                "${JOBS_JSON}" | while IFS=$'\t' read -r job_id job_name conclusion; do
                  echo
                  echo "--- job=${job_name} conclusion=${conclusion} id=${job_id} ---"
                  JOB_LOG="${RUNNER_TEMP}/job-${job_id}.log"
                  if gh api \
                    --allow-escape-sequences \
                    -H 'Accept: application/vnd.github+json' \
                    "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
                    > "${JOB_LOG}" 2>&1; then
                    tail -n 1200 "${JOB_LOG}"
                  else
                    echo 'Unable to download this completed job log.'
                    tail -n 120 "${JOB_LOG}" 2>/dev/null || true
                  fi
                done
            else
              echo 'Unable to enumerate job logs; raw API response follows.'
              test -f "${JOBS_JSON}" && cat "${JOBS_JSON}"
            fi
          } > "${REPORT}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.41.13+152 Phase 0+1 Time Audit Hardening candidate' \
              --notes 'Draft used for the Phase 0+1 isolation and time audit hardening checkpoint. It is not a published release.'
          fi
          RELEASE_URL="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${RELEASE_URL}" >> "${REPORT}"
          gh release upload "${TAG}" \
            "${REPORT}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
          MONITOR_BRANCH='ci-monitor-v0345'
          MONITOR_PATH='.ci/v04113-monitor.txt'
          MONITOR_CONTENT="$(base64 -w0 "${REPORT}")"
          MONITOR_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}?ref=${MONITOR_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if test -n "${MONITOR_SHA}"; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Update v0.41.13 CI failure monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" \
              -f sha="${MONITOR_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Create v0.41.13 CI failure monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" >/dev/null
          fi
