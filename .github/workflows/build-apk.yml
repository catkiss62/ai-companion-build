          )
          with zipfile.ZipFile(apk) as z:
              for name in libs:
                  source = (src / name).read_bytes()
                  packed = z.read('lib/arm64-v8a/' + name)
                  if source != packed:
                      print(f'ERROR: release packaging changed {name}', file=sys.stderr)
                      sys.exit(1)
                  print(name, len(source), hashlib.sha256(source).hexdigest())
              for relative, expected in tts_manifest['assets'].items():
                  packed = z.read('assets/' + relative)
                  actual = hashlib.sha256(packed).hexdigest()
                  if len(packed) != expected['size'] or actual != expected['sha256']:
                      print(f'ERROR: release APK TTS asset mismatch: {relative}', file=sys.stderr)
                      sys.exit(1)
              print('All 27 upgraded Meju TTS assets are size/hash exact in the APK.')
