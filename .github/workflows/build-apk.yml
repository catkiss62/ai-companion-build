      - name: Upload v0.37.5+94 grounded emotion APK to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.37.6-chat-recovery-presentation-test'
          APK_NAME='AI-Companion-v0.37.6-95-Chat-Recovery-Presentation-APK.apk'
          SHA_NAME="${APK_NAME}.sha256"
          CI_NAME='AI-Companion-v0.37.6-95-CI-Monitor.txt'
          cp app/build/app/outputs/flutter-apk/app-release.apk "app/${APK_NAME}"
          sed "s#app/build/app/outputs/flutter-apk/app-release.apk#${APK_NAME}#" \
            app/app-release.apk.sha256 > "app/${SHA_NAME}"
          {
            echo 'status=success'
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo "signer_sha256=${AI_COMPANION_SIGNER_SHA256}"
            cat "app/${SHA_NAME}"
          } > "app/${CI_NAME}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.37.6+95 chat recovery and presentation test candidate' \
              --notes 'Draft-only v0.37.5 candidate: keeps the v0.37.4 audio/presentation stabilization, strips empty or invalid emotion envelopes without losing body text, and adds evidence-grounded Appraisal to Emotion Episode continuity. The per-turn DeepSeek 19-label expression remains the only avatar/audio authority. Native 19emo remains absent; the persistent v1 private test signer is unchanged and schema advances to 29.'
          else
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}"
          fi
          RELEASE_URL="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${RELEASE_URL}" >> "app/${CI_NAME}"
          upload_ok=0
          for attempt in 1 2 3 4; do
            if gh release upload "${TAG}" \
              "app/${APK_NAME}" \
              "app/${SHA_NAME}" \
              "app/${CI_NAME}" \
              --clobber \
              --repo "${GITHUB_REPOSITORY}"; then
              upload_ok=1
              break
            fi
            echo "Draft Release upload attempt ${attempt}/4 failed; retrying shortly."
            sleep $((attempt * 5))
          done
          test "${upload_ok}" = '1'
          MONITOR_BRANCH='ci-monitor-v0345'
          MONITOR_PATH='.ci/v0375-monitor.txt'
          MONITOR_CONTENT="$(base64 -w0 "app/${CI_NAME}")"
          MONITOR_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}?ref=${MONITOR_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if test -n "${MONITOR_SHA}"; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Update v0.37.6 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" \
              -f sha="${MONITOR_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Create v0.37.6 CI success monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" >/dev/null
          fi

  report-ci-failure:
    needs:
      - detect-change-scope
      - build-apk
    if: ${{ always() && needs.detect-change-scope.outputs.run-full-build == 'true' && needs.build-apk.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Publish failed-job diagnostics to the private draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build-apk.result }}
        run: |
          set -uo pipefail
          TAG='v0.37.6-chat-recovery-presentation-test'
          CI_NAME='AI-Companion-v0.37.6-95-CI-Monitor.txt'
          REPORT="${RUNNER_TEMP}/${CI_NAME}"
          JOBS_JSON="${RUNNER_TEMP}/jobs.json"
          {
            echo 'status=failure'
            echo "build_result=${BUILD_RESULT}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "head_sha=${GITHUB_SHA}"
            echo
            echo '=== failed or cancelled job logs ==='
            if gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?filter=latest&per_page=100" \
              > "${JOBS_JSON}" 2>&1 && jq -e '.jobs' "${JOBS_JSON}" >/dev/null 2>&1; then
              jq -r \
                '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != null) | [.id, .name, .conclusion] | @tsv' \
                "${JOBS_JSON}" | while IFS=$'\t' read -r job_id job_name conclusion; do
                  echo
                  echo "--- job=${job_name} conclusion=${conclusion} id=${job_id} ---"
                  JOB_LOG="${RUNNER_TEMP}/job-${job_id}.log"
                  if gh api \
                    -H 'Accept: application/vnd.github+json' \
                    "/repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
                    > "${JOB_LOG}" 2>&1; then
                    tail -n 1200 "${JOB_LOG}"
                  else
                    echo 'Unable to download this completed job log.'
                    tail -n 120 "${JOB_LOG}" 2>/dev/null || true
                  fi
                done
            else
              echo 'Unable to enumerate job logs; raw API response follows.'
              test -f "${JOBS_JSON}" && cat "${JOBS_JSON}"
            fi
          } > "${REPORT}"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title 'AI Companion v0.37.6+95 chat recovery and presentation test candidate' \
              --notes 'Private draft used for CI diagnostics and the v0.37.5 grounded emotion episode APK. It is not a public release.'
          fi
          RELEASE_URL="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${RELEASE_URL}" >> "${REPORT}"
          gh release upload "${TAG}" \
            "${REPORT}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
          MONITOR_BRANCH='ci-monitor-v0345'
          MONITOR_PATH='.ci/v0375-monitor.txt'
          MONITOR_CONTENT="$(base64 -w0 "${REPORT}")"
          MONITOR_SHA="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}?ref=${MONITOR_BRANCH}" --jq '.sha' 2>/dev/null || true)"
          if test -n "${MONITOR_SHA}"; then
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Update v0.37.6 CI failure monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" \
              -f sha="${MONITOR_SHA}" >/dev/null
          else
            gh api --method PUT "/repos/${GITHUB_REPOSITORY}/contents/${MONITOR_PATH}" \
              -f message='Create v0.37.6 CI failure monitor' \
              -f content="${MONITOR_CONTENT}" \
              -f branch="${MONITOR_BRANCH}" >/dev/null
          fi
